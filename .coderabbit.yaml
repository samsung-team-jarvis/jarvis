# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit GitHub App을 org에 설치해야 동작한다.
language: 'ko-KR'

tone_instructions: |
  한국어로 간결하고 건설적으로 리뷰해요. 안전(safety), 정확한 측정 기록, 유지보수성을 우선해요.
  상세 규칙은 AGENTS.md와 docs/ 문서를 최우선으로 적용해요.

reviews:
  profile: 'assertive'
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  suggested_labels: true
  sequence_diagrams: false
  changed_files_summary: true
  collapse_walkthrough: true
  abort_on_close: true

  path_filters:
    - '!**/*.onnx'
    - '!**/*.rknn'
    - '!**/*.rkllm'
    - '!**/*.pt'
    - '!**/*.ipynb'
    - '!**/*.png'
    - '!**/*.jpg'
    - '!**/*.wav'

  path_instructions:
    - path: 'services/safety_guard/**'
      instructions: |
        안전 계층(L1) 리뷰:
        - 결정론적 규칙만 사용하는지 (학습 모델·랜덤 금지)
        - LLM 출력이 화이트리스트·스키마 검증 없이 통과하는 경로가 없는지
        - 위험 상태에서 실행형 Action이 REJECT 되는지, 테스트가 있는지

    - path: 'firmware/**'
      instructions: |
        ESP32 펌웨어 리뷰:
        - 부팅·연결 끊김·오류 시 모든 출력이 안전 상태(OFF)로 가는지
        - 하트비트 타임아웃과 온도 하드 리밋이 Pi와 무관하게 동작하는지
        - 핀·임계값이 상수로 모여 있는지

    - path: 'services/**'
      instructions: |
        서비스 코드 리뷰:
        - 메시지를 common/ 스키마로만 만들고 읽는지 (docs/architecture/interfaces.md)
        - 위험 감지 경로가 LLM을 거치지 않는지
        - 하드웨어 없이도 실행 가능한 입력 교체 구조인지
        - 처리 시간 측정 필드가 payload에 있는지, time.monotonic()을 쓰는지
        - 설정값 하드코딩 여부

    - path: 'common/**'
      instructions: |
        공통 모듈 리뷰:
        - interfaces.md와 필드·타입이 일치하는지
        - 규격 변경 시 interfaces.md 변경 이력이 함께 수정됐는지

    - path: 'training/**'
      instructions: |
        학습·변환 코드 리뷰:
        - Train/Validation/Test가 그룹 단위로 분리되는지, Test 데이터가 학습·캘리브레이션에 섞이지 않는지
        - chat template·eos·전처리 설정이 학습/변환/추론에서 같은지
        - 사용한 툴 버전이 docs/conventions/versions.md와 맞는지

    - path: 'docs/METRICS.md'
      instructions: |
        측정 기록 리뷰:
        - 새로 기록된 수치에 측정 조건(보드, 버전, 데이터셋, 커밋)이 있는지
        - 근거 없는 추정 수치가 아닌지 (PR의 Measurement·Evidence와 일치하는지)

    - path: 'docs/**'
      instructions: |
        문서 리뷰:
        - AGENTS.md가 허브 역할만 하고 규칙을 중복하지 않는지
        - docs/index.md에서 새 문서에 도달 가능한지
        - 실행한 검증과 계획을 구분해서 적었는지

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - 'main'
    labels:
      - '!wip'
      - '!skip-review'

  pre_merge_checks:
    title:
      mode: 'warning'
      requirements: 'PR 제목은 [PREFIX](scope): #이슈번호 work summary 형식을 따릅니다.'
    description:
      mode: 'warning'

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  tools:
    ruff:
      enabled: true
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    languagetool:
      enabled: true
      level: 'default'

chat:
  art: false
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - 'AGENTS.md'
      - 'docs/**/*.md'
      - 'recipes/**/*.md'
      - 'templates/**/*.md'
      - '.claude/skills/**/SKILL.md'
