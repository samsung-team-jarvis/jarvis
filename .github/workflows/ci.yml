name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check relative links in markdown
        run: python scripts/check_doc_links.py

  python:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  script-tests:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests (common, scripts)
        run: pytest tests scripts/tests -q

  forbidden-files:
    name: No model weights / raw data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if model weights or raw media are tracked
        run: |
          found=$(git ls-files | grep -Ei '\.(pt|pth|onnx|rknn|rkllm|safetensors|gguf|wav|mp3|mp4)$' || true)
          if [ -n "$found" ]; then
            echo "::error::Tracked model/raw data files found:"
            echo "$found"
            exit 1
          fi
          echo "OK"
