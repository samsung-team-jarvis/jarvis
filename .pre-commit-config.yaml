# 설치: pip install pre-commit && pre-commit install
#   → pre-commit / commit-msg / pre-push 훅이 한 번에 설치된다.
# 최신 버전으로 갱신: pre-commit autoupdate
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10  # requirements-dev.txt의 ruff 버전과 맞춘다
    hooks:
      - id: ruff
        args: ['--fix']
      - id: ruff-format

  - repo: local
    hooks:
      - id: forbid-model-and-raw-data
        name: 모델 가중치·원본 데이터 커밋 금지
        entry: 모델 가중치·원본 데이터는 Drive에 두고 매니페스트만 커밋하세요
        language: fail
        files: '\.(pt|pth|onnx|rknn|rkllm|safetensors|gguf|wav|mp3|mp4)$'
      - id: check-doc-links
        name: 문서 상대 링크 검사
        entry: python3 scripts/check_doc_links.py
        language: system
        pass_filenames: false
        files: '\.md$'
      - id: check-commit-message
        name: 커밋 메시지 형식 검사 (docs/conventions/git.md)
        entry: python3 scripts/check_conventions.py commit-msg
        language: system
        stages: [commit-msg]
      - id: check-branch-name
        name: 브랜치 이름 형식 검사 · main 직접 push 차단
        entry: python3 scripts/check_conventions.py branch
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
