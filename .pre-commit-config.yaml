# 설치: pip install pre-commit && pre-commit install
#   → pre-commit / commit-msg / pre-push 훅이 한 번에 설치된다.
# 최신 버전으로 갱신: pre-commit autoupdate
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      # Unity가 저장하는 에셋(장면·.meta 등)은 줄 끝 공백을 남긴다. 고쳐도 Unity가 다시 넣으므로 검사하지 않는다.
      - id: end-of-file-fixer
        exclude: '^kitchen/.*\.(unity|prefab|asset|meta|mat|anim|controller|overrideController|inputactions|physicMaterial|lighting|mask|playable|signal|preset|spriteatlas|shadergraph|shadersubgraph|vfx|terrainlayer)$'
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']
        exclude: '^kitchen/.*\.(unity|prefab|asset|meta|mat|anim|controller|overrideController|inputactions|physicMaterial|lighting|mask|playable|signal|preset|spriteatlas|shadergraph|shadersubgraph|vfx|terrainlayer)$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10  # requirements-dev.txt의 ruff 버전과 맞춘다
    hooks:
      - id: ruff-check
        args: ['--fix']
      - id: ruff-format

  - repo: local
    hooks:
      - id: forbid-model-and-raw-data
        name: 모델 가중치·원본 데이터·외부 자료 커밋 금지
        entry: 모델 가중치·원본 데이터·학교 자료(pdf·xlsx 등)는 커밋하지 말고 docs/artifacts.md 규칙대로 직접 전달하세요
        language: fail
        files: '\.(pt|pth|onnx|rknn|rkllm|safetensors|gguf|wav|mp3|mp4|pdf|xlsx|pptx|docx)$'
      - id: check-doc-links
        name: 문서 상대 링크 검사
        entry: python3 scripts/check_doc_links.py
        language: system
        pass_filenames: false
        files: '\.md$'
      - id: check-commit-message
        name: 커밋 메시지 형식 검사 (docs/conventions/git.md)
        entry: python3 scripts/check_conventions.py commit-msg
        language: system
        stages: [commit-msg]
      - id: check-branch-name
        name: 브랜치 이름 형식 검사 · main 직접 push 차단
        entry: python3 scripts/check_conventions.py branch
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
