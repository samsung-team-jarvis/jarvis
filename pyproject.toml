[project]
name = "jarvis"
version = "0.0.0"
description = "온디바이스 스마트 주방 어시스턴트 JARVIS"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
# 문서 속 예시 코드 블록은 포맷·린트 대상에서 제외
extend-exclude = ["*.md", "**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# 노트북: 셸 명령(!pip ...)의 긴 URL, 셀 중간 import, import 확인용 셀은 허용
"*.ipynb" = ["E501", "E402", "F401"]
