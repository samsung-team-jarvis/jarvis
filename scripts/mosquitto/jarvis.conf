# mosquitto 설정 — 가상 주방 PC가 보드의 브로커에 접속할 때 쓴다 (interfaces.md §4.6).
#
# mosquitto 2는 설정 파일이 없으면 같은 기기(localhost)의 접속만 받는다.
# 아래 두 줄은 같은 네트워크의 다른 기기도 인증 없이 접속하게 한다.
# 보드와 가상 주방 PC를 랜선으로만 이은 망에서 쓴다. 인터넷에 연결된 망에서는 쓰지 않는다.
#
# 보드 미검증 (2026-10-06). 사용:
#   sudo cp scripts/mosquitto/jarvis.conf /etc/mosquitto/conf.d/jarvis.conf && sudo systemctl restart mosquitto
#   또는: mosquitto -c scripts/mosquitto/jarvis.conf

listener 1883 0.0.0.0
allow_anonymous true
