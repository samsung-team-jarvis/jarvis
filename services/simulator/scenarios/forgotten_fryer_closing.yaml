# 가열 장치 켜짐 방치: 마감하며 조명·음악은 끄고 튀김기는 잊는다.
# 값은 개발용 가상 값이다 (측정값 아님). 온도는 세기 시간표로 계산한다 (interfaces §4.5).
name: forgotten_fryer_closing
description: 튀김기 세기 1(보온) → 55초 조명·음악 끔 → 60초에 떠남 → 튀김기 켜진 채 방치
duration_s: 150

heaters:            # [시각, 세기 0~3] — 그 시각부터 다음 항목 전까지
  fryer: [[0, 0], [3, 1]]

vision:
  fps: 2
  objects:          # [시각, 보이는 클래스] — person이 없으면 조리 구역에 사람 없음
    - [0, [person]]
    - [60, []]

stt:
  - [3, "자비스 튀김기 켜줘"]
  - [55, "자비스 조명 꺼줘"]
  - [57, "자비스 음악 꺼 줘"]

expected:          # 정답 State (FUS-05 규칙으로 계산)
  - [0, IDLE]
  - [3, PREHEAT]
  - [34, COOKING]
  - [90, UNATTENDED]
