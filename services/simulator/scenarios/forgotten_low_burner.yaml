# 가열 장치 켜짐 방치: 약불로 줄여 놓고 잊은 채 자리를 떠난다.
# 값은 개발용 가상 값이다 (측정값 아님). 온도는 세기 시간표로 계산한다 (interfaces §4.5).
name: forgotten_low_burner
description: 1번 화구 세기 2 → 60초에 세기 1로 줄임 → 70초에 자리를 떠나 돌아오지 않음
duration_s: 160

heaters:            # [시각, 세기 0~3] — 그 시각부터 다음 항목 전까지
  burner_1: [[0, 0], [3, 2], [60, 1]]

vision:
  fps: 2
  objects:          # [시각, 보이는 클래스] — person이 없으면 조리 구역에 사람 없음
    - [0, [person]]
    - [70, []]

stt:
  - [3, "자비스 1번 화구 중간으로 해줘"]
  - [60, "자비스 1번 불 약하게 해줘"]

expected:          # 정답 State (FUS-05 규칙으로 계산)
  - [0, IDLE]
  - [3, PREHEAT]
  - [16, COOKING]
  - [100, UNATTENDED]
