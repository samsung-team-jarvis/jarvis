# 가열 장치 켜짐 방치: 1번 화구만 끄고 2번 화구를 잊는다.
# 값은 개발용 가상 값이다 (측정값 아님). 온도는 세기 시간표로 계산한다 (interfaces §4.5).
name: forgotten_second_burner
description: 1번 세기 2 + 2번 세기 1 → 1번만 끄고 85초에 자리를 떠남 → 2번이 켜진 채 방치
duration_s: 160

heaters:            # [시각, 세기 0~3] — 그 시각부터 다음 항목 전까지
  burner_1: [[0, 0], [3, 2], [80, 0]]
  burner_2: [[0, 0], [20, 1]]

vision:
  fps: 2
  objects:          # [시각, 보이는 클래스] — person이 없으면 조리 구역에 사람 없음
    - [0, [person]]
    - [85, []]

stt:
  - [3, "자비스 1번 화구 중간으로 해줘"]
  - [20, "자비스 2번 화구 켜줘"]
  - [80, "자비스 1번 불 꺼줘"]

expected:          # 정답 State (FUS-05 규칙으로 계산)
  - [0, IDLE]
  - [3, PREHEAT]
  - [16, COOKING]
  - [115, UNATTENDED]
