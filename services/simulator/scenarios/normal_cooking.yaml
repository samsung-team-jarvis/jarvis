# 정상 조리: 예열 → 조리 → 불 끄기. 사람은 계속 화구 앞에 있다.
# 값은 개발용 가상 값이다 (측정값 아님). 온도는 세기 시간표로 계산한다 (interfaces §4.5).
name: normal_cooking
description: 1번 화구 세기 2로 조리, 음성으로 후드·타이머, 호출어 없는 혼잣말, 조리 끝나면 불 끔
duration_s: 130

heaters:            # [시각, 세기 0~3] — 그 시각부터 다음 항목 전까지
  burner_1: [[0, 0], [5, 2], [100, 0]]

vision:
  fps: 2
  objects:          # [시각, 보이는 클래스] — person이 없으면 조리 구역에 사람 없음
    - [0, [person]]

stt:
  - [3, "자비스 후드 켜줘"]
  - [5, "자비스 1번 화구 중간으로 해줘"]
  - [45, "자비스 타이머 오 분 맞춰줘"]
  - [80, "오늘 저녁 뭐 먹지"]
  - [100, "자비스 1번 불 꺼줘"]

expected:          # 정답 State (FUS-05 규칙으로 계산)
  - [0, IDLE]
  - [5, PREHEAT]
  - [18, COOKING]
  - [100, IDLE]
