# 정상 조리: 예열 → 조리 → 불 끄기. 사람은 계속 화구 앞에 있다.
# 값은 개발용 가상 값이다 (측정값 아님). 실제 시나리오는 FUS-05에서 정의한다.
name: normal_cooking
description: 예열 후 조리, 음성으로 후드 켜고 타이머 설정, 조리 끝나면 불 끔
duration_s: 120
heartbeat_hz: 1

sensor:
  device_id: esp32-1
  hz: 1
  temperature_c:   # [시각(초), 온도] — 사이는 직선으로 이어진다
    - [0, 25]
    - [40, 170]
    - [100, 175]
    - [120, 120]
  current_a:
    - [0, 0.0]
    - [2, 1.2]
    - [100, 1.2]
    - [101, 0.0]

vision:
  fps: 2
  objects:          # [시각, 그때부터 보이는 객체] — 다음 항목 전까지 유지
    - [0, [pan, burner_off, person]]
    - [2, [pan, burner_on, person]]
    - [101, [pan, burner_off, person]]

stt:
  - [10, "자비스 후드 켜줘"]
  - [45, "자비스 타이머 오 분 맞춰줘"]
  - [80, "오늘 저녁 뭐 먹지"]   # 호출어 없음 → 명령으로 처리하면 안 됨
