stt:
  - [5, "자비스 1번 화구 세게 해줘"]
  - [25, "자비스 1번 불 꺼줘"]

expected:          # 정답 State (FUS-05 규칙으로 계산)
  - [0, IDLE]
  - [5, PREHEAT]
  - [13, COOKING]
  - [25, IDLE]
