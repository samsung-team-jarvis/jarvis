# 정상 조리: 약불로 오래 끓인다 (예열이 길다).
# 값은 개발용 가상 값이다 (측정값 아님). 온도는 세기 시간표로 계산한다 (interfaces §4.5).
name: normal_simmer
description: 2번 화구 세기 1(목표 120°C) — 100°C에 닿기까지 30초 정도 예열
duration_s: 200

heaters:            # [시각, 세기 0~3] — 그 시각부터 다음 항목 전까지
  burner_2: [[0, 0], [5, 1], [170, 0]]

vision:
  fps: 2
  objects:          # [시각, 보이는 클래스] — person이 없으면 조리 구역에 사람 없음
    - [0, [person]]

stt:
  - [5, "자비스 2번 화구 켜줘"]
  - [170, "자비스 2번 불 꺼줘"]

expected:          # 정답 State (FUS-05 규칙으로 계산)
  - [0, IDLE]
  - [5, PREHEAT]
  - [36, COOKING]
  - [170, IDLE]
