# 정상 조리: 화구 두 개를 시간차로 쓴다.
# 값은 개발용 가상 값이다 (측정값 아님). 온도는 세기 시간표로 계산한다 (interfaces §4.5).
name: normal_two_burners
description: 1번 화구 세기 2, 25초 뒤 2번 화구 세기 1 추가, 차례로 끔
duration_s: 150

heaters:            # [시각, 세기 0~3] — 그 시각부터 다음 항목 전까지
  burner_1: [[0, 0], [5, 2], [110, 0]]
  burner_2: [[0, 0], [30, 1], [120, 0]]

vision:
  fps: 2
  objects:          # [시각, 보이는 클래스] — person이 없으면 조리 구역에 사람 없음
    - [0, [person]]

stt:
  - [5, "자비스 1번 화구 중간으로 해줘"]
  - [30, "자비스 2번 화구 켜줘"]
  - [110, "자비스 1번 불 꺼줘"]
  - [120, "자비스 2번 불 꺼줘"]

expected:          # 정답 State (FUS-05 규칙으로 계산)
  - [0, IDLE]
  - [5, PREHEAT]
  - [18, COOKING]
  - [120, IDLE]
