# 정상 + 주의: 센 불이 200°C를 넘어 주의가 뜨고, 중불로 낮춰 위험까지 가지 않는다.
# 값은 개발용 가상 값이다 (측정값 아님). 온도는 세기 시간표로 계산한다 (interfaces §4.5).
name: normal_warn_peak
description: 1번 화구 세기 3 → 30초 뒤 세기 2로 낮춤, 최고 약 217°C (주의 200 넘음, 위험 240 아래)
duration_s: 100

heaters:            # [시각, 세기 0~3] — 그 시각부터 다음 항목 전까지
  burner_1: [[0, 0], [5, 3], [35, 2], [90, 0]]

vision:
  fps: 2
  objects:          # [시각, 보이는 클래스] — person이 없으면 조리 구역에 사람 없음
    - [0, [person]]

stt:
  - [5, "자비스 1번 화구 세게 해줘"]
  - [35, "자비스 1번 불 중간으로 해줘"]
  - [90, "자비스 1번 불 꺼줘"]

expected:          # 정답 State (FUS-05 규칙으로 계산)
  - [0, IDLE]
  - [5, PREHEAT]
  - [13, COOKING]
  - [90, IDLE]
