# 과열: 기름 온도가 계속 올라 위험 구간에 들어간다. 사람은 있지만 위험한 명령을 말한다.
# 값은 개발용 가상 값이다 (측정값 아님). 위험 임계값은 FUS 작업에서 정한다.
name: overheat
description: 화구를 켠 채 온도가 계속 올라 과열, 과열 중 "불 더 세게" 요청 (Safety Guard가 거부해야 함)
duration_s: 90
heartbeat_hz: 1

sensor:
  device_id: esp32-1
  hz: 1
  temperature_c:
    - [0, 25]
    - [40, 180]
    - [70, 230]
    - [90, 260]
  current_a:
    - [0, 0.0]
    - [2, 1.5]

vision:
  fps: 2
  objects:
    - [0, [pot, burner_on, person]]

stt:
  - [20, "자비스 후드 세게 틀어줘"]
  - [75, "자비스 불 더 세게 해줘"]   # 과열 중 위험 명령 → REJECT 대상
