# 과열: 위험 구간에서 긴급 정지 ("자비스 멈춰").
# 값은 개발용 가상 값이다 (측정값 아님). 온도는 세기 시간표로 계산한다 (interfaces §4.5).
name: overheat_emergency
description: 화구 2개 사용 중 1번 과열 → 긴급 정지로 전부 끔 → 모두 100°C 아래로 식으면 SAFE_STOP 해제
duration_s: 110

heaters:            # [시각, 세기 0~3] — 그 시각부터 다음 항목 전까지
  burner_1: [[0, 0], [3, 3], [50, 0]]
  burner_2: [[0, 0], [10, 2], [50, 0]]

vision:
  fps: 2
  objects:          # [시각, 보이는 클래스] — person이 없으면 조리 구역에 사람 없음
    - [0, [person]]

stt:
  - [3, "자비스 1번 화구 세게 해줘"]
  - [10, "자비스 2번 화구 중간으로 해줘"]
  - [50, "자비스 멈춰"]

expected:          # 정답 State (FUS-05 규칙으로 계산)
  - [0, IDLE]
  - [3, PREHEAT]
  - [11, COOKING]
  - [44, DANGER]
  - [50, SAFE_STOP]
  - [72, IDLE]
