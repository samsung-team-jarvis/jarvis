# 과열: 튀김기 과열. 낮추라는 말은 위험 상태라 거부되고, 끄라는 말로 끈다.
# 값은 개발용 가상 값이다 (측정값 아님). 온도는 세기 시간표로 계산한다 (interfaces §4.5).
name: overheat_fryer
description: 튀김기 세기 3 → 위험 → "약하게"(Guard 거부, 세기 그대로) → "꺼 줘"로 끔
duration_s: 90

heaters:            # [시각, 세기 0~3] — 그 시각부터 다음 항목 전까지
  fryer: [[0, 0], [3, 3], [60, 0]]

vision:
  fps: 2
  objects:          # [시각, 보이는 클래스] — person이 없으면 조리 구역에 사람 없음
    - [0, [person]]

stt:
  - [3, "자비스 튀김기 세게 해줘"]
  - [56, "자비스 튀김기 약하게 해줘"]
  - [60, "자비스 튀김기 꺼 줘"]

expected:          # 정답 State (FUS-05 규칙으로 계산)
  - [0, IDLE]
  - [3, PREHEAT]
  - [11, COOKING]
  - [44, DANGER]
  - [63, IDLE]
