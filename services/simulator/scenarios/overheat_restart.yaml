# 과열 뒤 다시 조리: 위험에서 끄고, 식은 뒤 다시 켠다.
# 값은 개발용 가상 값이다 (측정값 아님). 온도는 세기 시간표로 계산한다 (interfaces §4.5).
name: overheat_restart
description: 1번 화구 세기 3 → 위험 → 끔 → 30초 뒤 세기 2로 다시 켜서 조리
duration_s: 130

heaters:            # [시각, 세기 0~3] — 그 시각부터 다음 항목 전까지
  burner_1: [[0, 0], [3, 3], [50, 0], [80, 2], [120, 0]]

vision:
  fps: 2
  objects:          # [시각, 보이는 클래스] — person이 없으면 조리 구역에 사람 없음
    - [0, [person]]

stt:
  - [3, "자비스 1번 화구 세게 해줘"]
  - [50, "자비스 1번 불 꺼줘"]
  - [80, "자비스 1번 화구 중간으로 해줘"]
  - [120, "자비스 1번 불 꺼줘"]

expected:          # 정답 State (FUS-05 규칙으로 계산)
  - [0, IDLE]
  - [3, PREHEAT]
  - [11, COOKING]
  - [44, DANGER]
  - [52, IDLE]
  - [80, PREHEAT]
  - [86, COOKING]
  - [120, IDLE]
