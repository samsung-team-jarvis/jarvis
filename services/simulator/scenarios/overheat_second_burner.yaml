# 과열: 두 화구 중 하나만 과열된다.
# 값은 개발용 가상 값이다 (측정값 아님). 온도는 세기 시간표로 계산한다 (interfaces §4.5).
name: overheat_second_burner
description: 1번 화구 세기 2(정상) + 2번 화구 세기 3(과열) → 2번만 끔 → 1번으로 계속 조리
duration_s: 140

heaters:            # [시각, 세기 0~3] — 그 시각부터 다음 항목 전까지
  burner_1: [[0, 0], [3, 2], [130, 0]]
  burner_2: [[0, 0], [10, 3], [62, 0]]

vision:
  fps: 2
  objects:          # [시각, 보이는 클래스] — person이 없으면 조리 구역에 사람 없음
    - [0, [person]]

stt:
  - [3, "자비스 1번 화구 중간으로 해줘"]
  - [10, "자비스 2번 화구 세게 해줘"]
  - [55, "자비스 2번 불 약하게 해줘"]
  - [62, "자비스 2번 불 꺼줘"]
  - [130, "자비스 1번 불 꺼줘"]

expected:          # 정답 State (FUS-05 규칙으로 계산)
  - [0, IDLE]
  - [3, PREHEAT]
  - [16, COOKING]
  - [51, DANGER]
  - [65, COOKING]
  - [130, IDLE]
