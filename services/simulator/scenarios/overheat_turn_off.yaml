# 과열: 위험 구간에 들어간 뒤 사람이 직접 끈다.
# 값은 개발용 가상 값이다 (측정값 아님). 온도는 세기 시간표로 계산한다 (interfaces §4.5).
name: overheat_turn_off
description: 1번 화구 세기 3 → 위험 → "1번 불 꺼줘"로 끔 → 230°C 아래로 내려가면 위험 해제
duration_s: 80

heaters:            # [시각, 세기 0~3] — 그 시각부터 다음 항목 전까지
  burner_1: [[0, 0], [3, 3], [52, 0]]

vision:
  fps: 2
  objects:          # [시각, 보이는 클래스] — person이 없으면 조리 구역에 사람 없음
    - [0, [person]]

stt:
  - [3, "자비스 1번 화구 세게 해줘"]
  - [52, "자비스 1번 불 꺼줘"]

expected:          # 정답 State (FUS-05 규칙으로 계산)
  - [0, IDLE]
  - [3, PREHEAT]
  - [11, COOKING]
  - [44, DANGER]
  - [54, IDLE]
