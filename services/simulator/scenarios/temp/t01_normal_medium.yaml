# 생성 파일 — 고치려면 services/simulator/temp_scenarios.py를 고치고 다시 생성한다.
# 값은 가상 주방 온도 규칙으로 계산한 설계값이다 (실측 아님). 정답 기준: FUS-05 decision.
name: t01_normal_medium
category: normal
description: 화구 중불로 2분 조리 후 끔
duration_s: 150
heartbeat_hz: 1

sensor:
  device_id: burner_1
  hz: 1
  temperature_c:
    - [0, 25.0]
    - [5, 46.5]
    - [10, 76.7]
    - [15, 100.1]
    - [20, 118.1]
    - [25, 132.1]
    - [30, 143.0]
    - [35, 151.3]
    - [40, 157.8]
    - [45, 162.8]
    - [50, 166.7]
    - [55, 169.7]
    - [60, 172.1]
    - [65, 173.8]
    - [70, 175.2]
    - [75, 176.3]
    - [80, 177.2]
    - [85, 177.8]
    - [90, 178.3]
    - [95, 178.7]
    - [100, 179.0]
    - [105, 179.2]
    - [110, 179.4]
    - [115, 179.5]
    - [120, 179.6]
    - [125, 179.7]
    - [130, 144.7]
    - [135, 117.6]
    - [140, 96.7]
    - [145, 80.5]
    - [150, 67.9]

vision:
  fps: 2
  objects:
    - [0, [pan, burner_on, person]]
    - [125, [pan, burner_off, person]]

stt:
  - [0, "자비스 1번 화구 켜 줘"]
  - [5, "자비스 1번 화구 중간으로"]
  - [125, "자비스 1번 화구 꺼 줘"]

expect:                       # 정답 State: [시각, State] — 그 시각부터 다음 항목 전까지
  - [0, PREHEAT]
  - [15, COOKING]
  - [125, IDLE]
