# 생성 파일 — 고치려면 services/simulator/temp_scenarios.py를 고치고 다시 생성한다.
# 값은 가상 주방 온도 규칙으로 계산한 설계값이다 (실측 아님). 정답 기준: FUS-05 decision.
name: t03_normal_sear_then_lower
category: normal
description: 센불로 시작해 20초 뒤 중불로 낮춤
duration_s: 150
heartbeat_hz: 1

sensor:
  device_id: burner_1
  hz: 1
  temperature_c:
    - [0, 25.0]
    - [5, 80.4]
    - [10, 123.3]
    - [15, 156.5]
    - [20, 182.2]
    - [25, 181.7]
    - [30, 181.3]
    - [35, 181.0]
    - [40, 180.8]
    - [45, 180.6]
    - [50, 180.5]
    - [55, 180.4]
    - [60, 180.3]
    - [65, 180.2]
    - [70, 180.2]
    - [75, 180.1]
    - [80, 180.1]
    - [85, 180.1]
    - [90, 180.1]
    - [95, 180.0]
    - [100, 180.0]
    - [105, 180.0]
    - [110, 180.0]
    - [115, 180.0]
    - [120, 180.0]
    - [125, 180.0]
    - [130, 180.0]
    - [135, 180.0]
    - [140, 180.0]
    - [145, 144.9]
    - [150, 117.8]

vision:
  fps: 2
  objects:
    - [0, [pan, burner_on, person]]
    - [140, [pan, burner_off, person]]

stt:
  - [20, "자비스 1번 화구 중간으로 해 줘"]

expect:                       # 정답 State: [시각, State] — 그 시각부터 다음 항목 전까지
  - [0, PREHEAT]
  - [8, COOKING]
  - [140, IDLE]
