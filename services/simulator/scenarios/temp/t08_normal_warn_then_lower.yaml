# 생성 파일 — 고치려면 services/simulator/temp_scenarios.py를 고치고 다시 생성한다.
# 값은 가상 주방 온도 규칙으로 계산한 설계값이다 (실측 아님). 정답 기준: FUS-05 decision.
name: t08_normal_warn_then_lower
category: normal
description: 센불로 200°C(주의)까지 갔다가 30초에 약불로
duration_s: 150
heartbeat_hz: 1

sensor:
  device_id: burner_1
  hz: 1
  temperature_c:
    - [0, 25.0]
    - [5, 80.4]
    - [10, 123.3]
    - [15, 156.5]
    - [20, 182.2]
    - [25, 202.0]
    - [30, 217.4]
    - [35, 195.4]
    - [40, 178.3]
    - [45, 165.1]
    - [50, 154.9]
    - [55, 147.0]
    - [60, 140.9]
    - [65, 136.2]
    - [70, 132.5]
    - [75, 129.7]
    - [80, 127.5]
    - [85, 125.8]
    - [90, 124.5]
    - [95, 123.5]
    - [100, 122.7]
    - [105, 122.1]
    - [110, 121.6]
    - [115, 121.2]
    - [120, 121.0]
    - [125, 120.7]
    - [130, 120.6]
    - [135, 120.4]
    - [140, 120.3]
    - [145, 98.8]
    - [150, 82.1]

vision:
  fps: 2
  objects:
    - [0, [pan, burner_on, person]]
    - [140, [pan, burner_off, person]]

stt:
  - [30, "자비스 1번 화구 약하게"]

expect:                       # 정답 State: [시각, State] — 그 시각부터 다음 항목 전까지
  - [0, PREHEAT]
  - [8, COOKING]
  - [140, IDLE]
