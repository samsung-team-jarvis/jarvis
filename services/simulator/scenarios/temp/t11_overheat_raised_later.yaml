# 생성 파일 — 고치려면 services/simulator/temp_scenarios.py를 고치고 다시 생성한다.
# 값은 가상 주방 온도 규칙으로 계산한 설계값이다 (실측 아님). 정답 기준: FUS-05 decision.
name: t11_overheat_raised_later
category: overheat
description: 중불로 조리하다 60초에 센불로 올려 과열
duration_s: 160
heartbeat_hz: 1

sensor:
  device_id: burner_1
  hz: 1
  temperature_c:
    - [0, 25.0]
    - [5, 60.1]
    - [10, 87.2]
    - [15, 108.2]
    - [20, 124.4]
    - [25, 137.0]
    - [30, 146.7]
    - [35, 154.3]
    - [40, 160.1]
    - [45, 164.6]
    - [50, 168.1]
    - [55, 170.8]
    - [60, 172.9]
    - [65, 194.8]
    - [70, 211.8]
    - [75, 225.0]
    - [80, 235.2]
    - [85, 243.1]
    - [90, 249.1]
    - [95, 253.9]
    - [100, 257.5]
    - [105, 260.3]
    - [110, 262.5]
    - [115, 208.8]
    - [120, 167.2]
    - [125, 135.0]
    - [130, 110.1]
    - [135, 90.9]
    - [140, 76.0]
    - [145, 64.4]
    - [150, 55.5]
    - [155, 48.6]
    - [160, 43.3]

vision:
  fps: 2
  objects:
    - [0, [pan, burner_on, person]]
    - [110, [pan, burner_off, person]]

stt:
  - [60, "자비스 1번 화구 세게 해 줘"]
  - [110, "자비스 멈춰"]

expect:                       # 정답 State: [시각, State] — 그 시각부터 다음 항목 전까지
  - [0, PREHEAT]
  - [13, COOKING]
  - [83, DANGER]
  - [110, SAFE_STOP]
