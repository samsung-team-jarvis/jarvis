# 생성 파일 — 고치려면 services/simulator/temp_scenarios.py를 고치고 다시 생성한다.
# 값은 가상 주방 온도 규칙으로 계산한 설계값이다 (실측 아님). 정답 기준: FUS-05 decision.
name: t12_overheat_estop
category: overheat
description: 과열 중 '불 더 세게'(거부 대상) 뒤 긴급 정지
duration_s: 120
heartbeat_hz: 1

sensor:
  device_id: burner_1
  hz: 1
  temperature_c:
    - [0, 25.0]
    - [5, 80.4]
    - [10, 123.3]
    - [15, 156.5]
    - [20, 182.2]
    - [25, 202.0]
    - [30, 217.4]
    - [35, 229.3]
    - [40, 238.5]
    - [45, 245.6]
    - [50, 251.1]
    - [55, 255.4]
    - [60, 203.3]
    - [65, 163.0]
    - [70, 131.7]
    - [75, 107.6]
    - [80, 88.9]
    - [85, 74.5]
    - [90, 63.3]
    - [95, 54.6]
    - [100, 47.9]
    - [105, 42.7]
    - [110, 38.7]
    - [115, 35.6]
    - [120, 33.2]

vision:
  fps: 2
  objects:
    - [0, [pan, burner_on, person]]
    - [55, [pan, burner_off, person]]

stt:
  - [45, "자비스 불 더 세게 해 줘"]
  - [55, "자비스 멈춰"]

expect:                       # 정답 State: [시각, State] — 그 시각부터 다음 항목 전까지
  - [0, PREHEAT]
  - [8, COOKING]
  - [41, DANGER]
  - [55, SAFE_STOP]
