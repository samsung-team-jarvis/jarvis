# 생성 파일 — 고치려면 services/simulator/temp_scenarios.py를 고치고 다시 생성한다.
# 값은 가상 주방 온도 규칙으로 계산한 설계값이다 (실측 아님). 정답 기준: FUS-05 decision.
name: t14_overheat_while_away
category: overheat
description: 센불로 켜고 자리 비운 사이 과열 (위험 우선)
duration_s: 110
heartbeat_hz: 1

sensor:
  device_id: burner_1
  hz: 1
  temperature_c:
    - [0, 25.0]
    - [5, 80.4]
    - [10, 123.3]
    - [15, 156.5]
    - [20, 182.2]
    - [25, 202.0]
    - [30, 217.4]
    - [35, 229.3]
    - [40, 238.5]
    - [45, 245.6]
    - [50, 251.1]
    - [55, 255.4]
    - [60, 258.7]
    - [65, 261.3]
    - [70, 263.2]
    - [75, 264.8]
    - [80, 220.5]
    - [85, 176.3]
    - [90, 142.1]
    - [95, 115.6]
    - [100, 95.1]
    - [105, 79.2]
    - [110, 67.0]

vision:
  fps: 2
  objects:
    - [0, [pan, burner_on, person]]
    - [15, [pan, burner_on]]
    - [76, [pan, burner_off]]

stt: []

expect:                       # 정답 State: [시각, State] — 그 시각부터 다음 항목 전까지
  - [0, PREHEAT]
  - [8, COOKING]
  - [41, DANGER]
  - [76, SAFE_STOP]
