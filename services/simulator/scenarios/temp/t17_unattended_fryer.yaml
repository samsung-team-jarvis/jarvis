# 생성 파일 — 고치려면 services/simulator/temp_scenarios.py를 고치고 다시 생성한다.
# 값은 가상 주방 온도 규칙으로 계산한 설계값이다 (실측 아님). 정답 기준: FUS-05 decision.
name: t17_unattended_fryer
category: unattended
description: 튀김기 켜 둔 채 자리를 떠남
duration_s: 150
heartbeat_hz: 1

sensor:
  device_id: fryer
  hz: 1
  temperature_c:
    - [0, 25.0]
    - [5, 60.1]
    - [10, 87.2]
    - [15, 108.2]
    - [20, 124.4]
    - [25, 137.0]
    - [30, 146.7]
    - [35, 154.3]
    - [40, 160.1]
    - [45, 164.6]
    - [50, 168.1]
    - [55, 170.8]
    - [60, 172.9]
    - [65, 174.5]
    - [70, 175.7]
    - [75, 176.7]
    - [80, 177.4]
    - [85, 178.0]
    - [90, 178.5]
    - [95, 178.8]
    - [100, 179.1]
    - [105, 179.3]
    - [110, 179.5]
    - [115, 179.6]
    - [120, 179.7]
    - [125, 179.7]
    - [130, 179.8]
    - [135, 179.8]
    - [140, 179.9]
    - [145, 179.9]
    - [150, 179.9]

vision:
  fps: 2
  objects:
    - [0, [fryer_basket, person]]
    - [50, [fryer_basket]]

stt: []

expect:                       # 정답 State: [시각, State] — 그 시각부터 다음 항목 전까지
  - [0, PREHEAT]
  - [13, COOKING]
  - [80, UNATTENDED]
