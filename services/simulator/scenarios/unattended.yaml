# 방치: 화구를 켠 채 사람이 자리를 비우고 돌아오지 않는다.
# 값은 개발용 가상 값이다 (측정값 아님). 온도는 세기 시간표로 계산한다 (interfaces §4.5).
name: unattended
description: 1번 화구 세기 2, 30초에 사람이 사라짐 → 30초 뒤 방치
duration_s: 150

heaters:            # [시각, 세기 0~3] — 그 시각부터 다음 항목 전까지
  burner_1: [[0, 0], [3, 2]]

vision:
  fps: 2
  objects:          # [시각, 보이는 클래스] — person이 없으면 조리 구역에 사람 없음
    - [0, [person]]
    - [30, []]

stt:
  - [3, "자비스 1번 화구 중간으로 해줘"]

expected:          # 정답 State (FUS-05 규칙으로 계산)
  - [0, IDLE]
  - [3, PREHEAT]
  - [16, COOKING]
  - [60, UNATTENDED]
