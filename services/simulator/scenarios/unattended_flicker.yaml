# 방치 아님: 사람 감지가 몇 초씩 끊긴다 (가림·인식 실패). 30초 연속으로 없지는 않다 (경계 사례).
# 값은 개발용 가상 값이다 (측정값 아님). 온도는 세기 시간표로 계산한다 (interfaces §4.5).
