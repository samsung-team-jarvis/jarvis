# 방치: 화면 밖에서 말로 화구를 켜고 오지 않는다 (켜진 때부터 사람 없음을 센다).
# 값은 개발용 가상 값이다 (측정값 아님). 온도는 세기 시간표로 계산한다 (interfaces §4.5).
name: unattended_on_from_afar
description: 사람 없음 상태에서 "1번 화구 켜줘" → 30초 뒤 방치 → 70초에 사람이 돌아옴
duration_s: 90

heaters:            # [시각, 세기 0~3] — 그 시각부터 다음 항목 전까지
  burner_1: [[0, 0], [5, 1]]

vision:
  fps: 2
  objects:          # [시각, 보이는 클래스] — person이 없으면 조리 구역에 사람 없음
    - [0, []]
    - [70, [person]]

stt:
  - [5, "자비스 1번 화구 켜줘"]

expected:          # 정답 State (FUS-05 규칙으로 계산)
  - [0, IDLE]
  - [5, PREHEAT]
  - [35, UNATTENDED]
  - [70, COOKING]
