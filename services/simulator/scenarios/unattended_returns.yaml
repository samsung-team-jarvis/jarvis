# 방치 후 복귀: 방치 판정 뒤 사람이 돌아와 다시 조리한다.
# 값은 개발용 가상 값이다 (측정값 아님). 온도는 세기 시간표로 계산한다 (interfaces §4.5).
name: unattended_returns
description: 1번 화구 세기 2, 20~75초 자리 비움 → 50초부터 방치 → 돌아오면 조리
duration_s: 150

heaters:            # [시각, 세기 0~3] — 그 시각부터 다음 항목 전까지
  burner_1: [[0, 0], [3, 2], [140, 0]]

vision:
  fps: 2
  objects:          # [시각, 보이는 클래스] — person이 없으면 조리 구역에 사람 없음
    - [0, [person]]
    - [20, []]
    - [75, [person]]

stt:
  - [3, "자비스 1번 화구 중간으로 해줘"]
  - [77, "자비스 지금 위험해?"]
  - [140, "자비스 1번 불 꺼줘"]

expected:          # 정답 State (FUS-05 규칙으로 계산)
  - [0, IDLE]
  - [3, PREHEAT]
  - [16, COOKING]
  - [50, UNATTENDED]
  - [75, COOKING]
  - [140, IDLE]
