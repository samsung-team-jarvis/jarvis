# LLM 데이터 Paraphrase 시트 v1 (LLM-04, 발표 p.9 ②)
#
# 기획 시트(plan_sheet.yaml)의 템플릿을 같은 뜻의 다른 말투로 바꿔 쓴 것이다.
# - 키 = 부모 템플릿 id. 바꿔 쓴 템플릿은 부모의 정답(output)·devices·indirect를 그대로 물려받는다
#   → 슬롯({device} {level} {time}) 자리가 같으므로 정답이 자동으로 따라온다 (④ Entity 치환).
# - 부모와 같은 "가족(group)"으로 묶여 LLM-05에서 가족 단위로 분할된다.
# - "(a|b|c)"는 선택지: 모든 조합으로 펼친다. 띄어쓰기·문장부호만 다른 중복은 빌드에서 지운다.
# - tone: 명령(반말 지시) · 요청(부탁·존댓말) · 평서(혼잣말·상황 설명)
#
# 생성 (SUDA 방식의 "생성 프롬프트"):
#   생성기: Claude (Claude Code, claude-opus-5-5), 2026-10-02, 사람 검수 전
#   프롬프트: "주방에서 1인 요리 중인 사람이 음성 비서에게 말하는 한국어 문장이다. 아래 템플릿과
#     같은 뜻(같은 Action·같은 장치·같은 값)으로, 실제로 입으로 말할 법한 표현을 반말·존댓말·평서로
#     3~6개 바꿔 써라. {device} 같은 자리는 그대로 두고, 뜻이 달라지는 말(더·덜·다른 장치)은 넣지 마라."

# 데이터 v1 Action별 목표 (Seed + Paraphrase 합계 2,280). Seed는 모두 넣고 나머지를 Paraphrase로 채운다
targets:
  TURN_ON: 320
  TURN_OFF: 320
  SET_LEVEL: 340
  SET_TIMER: 320
  CANCEL_TIMER: 120
  CHECK_STATUS: 180
  CHECK_RISK: 120
  EMERGENCY_STOP: 150
  ASK_CLARIFY: 230
  UNSUPPORTED: 180

paraphrases:
  # ---------------- TURN_ON ----------------
  on_01:
    - {tone: 명령, text: "{device} 좀 켜줘"}
    - {tone: 명령, text: "{device} 켜 봐"}
    - {tone: 명령, text: "{device} 얼른 켜"}
    - {tone: 요청, text: "{device} 켜 줄 수 있어"}
  on_03:
    - {tone: 요청, text: "{device_obj} 켜 주시겠어요"}
    - {tone: 요청, text: "{device} 좀 켜 주세요"}
    - {tone: 요청, text: "{device_obj} 켜 줄래요"}
  on_05:
    - {tone: 평서, text: "{device_obj} 켜야 할 것 같아"}
    - {tone: 평서, text: "이제 {device_obj} 켜자"}
    - {tone: 평서, text: "{device} 켜 놔야겠다"}
  on_06:
    - {tone: 명령, text: "{device} 좀 틀어"}
    - {tone: 요청, text: "{device} 틀어 주세요"}
    - {tone: 명령, text: "{device} 돌려"}
  on_ind_01:
    - {tone: 평서, text: "(연기가|연기) (너무|엄청|많이) (나네|난다)"}
    - {tone: 평서, text: "(냄새 빼야겠다|냄새 좀 빼자)"}
    - {tone: 평서, text: "(주방이|부엌이) 너무 (매캐해|답답해)"}
  on_ind_04:
    - {tone: 평서, text: "(라면|파스타|국) 끓일 거니까 {device_obj} 켜줘"}
    - {tone: 평서, text: "(계란 삶을|고기 구울) 거야 {device_obj} 켜줘"}

  # ---------------- TURN_OFF ----------------
  off_01:
    - {tone: 명령, text: "{device} 좀 꺼줘"}
    - {tone: 명령, text: "{device} 꺼 봐"}
    - {tone: 요청, text: "{device} 꺼 줄 수 있어"}
  off_03:
    - {tone: 요청, text: "{device_obj} 꺼 주시겠어요"}
    - {tone: 요청, text: "{device} 좀 꺼 주세요"}
  off_05:
    - {tone: 평서, text: "이제 {device_obj} 끄자"}
    - {tone: 평서, text: "{device} 꺼도 될 것 같아"}
  off_06:
    - {tone: 명령, text: "{device} 이제 꺼"}
  off_02:
    - {tone: 명령, text: "{device} 꺼 버려"}
    - {tone: 명령, text: "{device} 꺼 놔"}
  off_04:
    - {tone: 요청, text: "{device_obj} 꺼 줄래요"}
    - {tone: 요청, text: "{device} 좀 꺼 줄 수 있을까"}
  off_ind_03:
    - {tone: 평서, text: "(이제|다) 끝났으니까 (전부|다) 꺼"}
  off_ind_01:
    - {tone: 평서, text: "(환기|환기는) (이제 됐어|충분해)"}
    - {tone: 평서, text: "연기 다 빠졌어"}
  off_ind_02:
    - {tone: 평서, text: "(요리|음식) 다 (됐어|끝났어) (다 꺼줘|전부 꺼줘)"}
    - {tone: 평서, text: "(밥 다 먹었어|설거지할 거야) 다 꺼도 돼"}

  # ---------------- SET_LEVEL ----------------
  lv_01:
    - {tone: 명령, text: "{device} 좀 {level} 해줘"}
    - {tone: 명령, text: "{device} {level} 해 봐"}
    - {tone: 요청, text: "{device} {level} 해 줄 수 있어"}
  lv_03:
    - {tone: 요청, text: "{device} {level} 해 주시겠어요"}
    - {tone: 요청, text: "{device_obj} {level} 맞춰 주세요"}
  lv_05:
    - {tone: 평서, text: "{device} {level} 하자"}
    - {tone: 평서, text: "{device} {level} 하는 게 좋겠다"}
  lv_ind_01:
    - {tone: 평서, text: "(연기가|냄새가) (안 빠져|계속 나) (후드|환풍기) (최대로|제일 세게|세게)"}
  lv_ind_02:
    - {tone: 평서, text: "(끓어 넘치겠다|타겠다|너무 세다) {device} (약하게|약으로)"}

  # ---------------- SET_TIMER ----------------
  tm_02:
    - {tone: 명령, text: "타이머 {time} 설정해줘"}
    - {tone: 명령, text: "{time} 타이머 켜줘"}
    - {tone: 요청, text: "타이머 {time} 맞춰 줄래"}
  tm_04:
    - {tone: 요청, text: "{time} 뒤에 알려 줘"}
    - {tone: 요청, text: "{time} 지나면 알려 주세요"}
    - {tone: 명령, text: "{time} 재 줘"}
  tm_06:
    - {tone: 명령, text: "{time} 후에 {device} 꺼줘"}
    - {tone: 요청, text: "{time} 지나면 {device_obj} 꺼 주세요"}
    - {tone: 명령, text: "{device} {time}만 켜 두고 꺼줘"}
  tm_ind_01:
    - {tone: 평서, text: "(라면|컵라면) (3분만|삼 분만) (재 줘|알려 줘)"}

  # ---------------- CANCEL_TIMER ----------------
  ct_01:
    - {tone: 명령, text: "(타이머|알람) (취소|끄기|꺼)"}
    - {tone: 요청, text: "(타이머|알람) (취소해 줄래|꺼 줄래|꺼 줄 수 있어)"}
  ct_04:
    - {tone: 평서, text: "(타이머|알람) (필요 없어|안 맞춰도 돼|이제 됐어)"}
  ct_06:
    - {tone: 명령, text: "{device} 타이머 꺼줘"}
    - {tone: 요청, text: "{device} 타이머 취소해 주세요"}
    - {tone: 명령, text: "{device} 끄는 타이머 취소"}
  ct_07:
    # "타이머 정지"는 타이머 취소다 (긴급 정지가 아님)
    - {tone: 명령, text: "(타이머|알람) (멈춰 줘|정지해 줘|중지)"}
  ct_13:
    - {tone: 명령, text: "(아까|방금) (맞춘|맞춰 둔) (타이머|알람) (취소해|꺼 줘|없애 줘)"}

  # ---------------- CHECK_STATUS ----------------
  st_01:
    - {tone: 명령, text: "{device} 켜져 있나"}
    - {tone: 명령, text: "{device} 지금 켜져 있어"}
    - {tone: 요청, text: "{device} 켜져 있는지 알려 줘"}
  st_02:
    - {tone: 명령, text: "{device} 꺼진 거 맞아"}
    - {tone: 요청, text: "{device} 꺼졌는지 확인해 줘"}
  st_03:
    - {tone: 요청, text: "{device} 어떻게 돼 있어"}
    - {tone: 명령, text: "{device} 상태 어때"}
  st_04:
    - {tone: 명령, text: "(지금|현재) (켜져 있는 거|켜진 거) (뭐야|있어)"}
    - {tone: 요청, text: "뭐 켜져 있는지 알려 줘"}
  st_06:
    - {tone: 요청, text: "(전부|다|모두) 꺼졌는지 (봐 줘|확인해 줘|알려 줘)"}

  # ---------------- CHECK_RISK ----------------
  rk_01:
    - {tone: 명령, text: "(지금|혹시) (위험한 거 아니야|위험하진 않지|괜찮은 거지)"}
  rk_05:
    - {tone: 요청, text: "(위험한지|안전한지) (봐 줄래|확인해 줄 수 있어|체크해 줘)"}
  rk_06:
    - {tone: 평서, text: "(잠깐|화장실) (나갔다 와도|다녀와도) (괜찮을까|돼)"}
  rk_12:
    - {tone: 평서, text: "(기름이|팬이) 너무 뜨거운 것 같은데 괜찮아"}
    - {tone: 명령, text: "(온도|불) 너무 높은 거 아니야"}
  rk_02:
    - {tone: 요청, text: "(지금|주방) 안전한지 (봐 줘|알려 줘|확인해 줘)"}
  rk_03:
    - {tone: 명령, text: "(뭐|혹시) 위험한 (거|것) (있어|없지|있나)"}
  rk_08:
    - {tone: 명령, text: "(불|화구|기름) (괜찮지|괜찮은 거야|괜찮나)"}
  rk_11:
    - {tone: 명령, text: "(팬|기름|냄비|화구) (과열된|너무 달궈진) 거 아니야"}
  rk_15:
    - {tone: 평서, text: "(음식|냄비|고기) 타는 거 아니지"}
    - {tone: 평서, text: "(타는|탄) 냄새 나는데 괜찮아"}
  rk_16:
    - {tone: 요청, text: "(잠깐|조금) (자리 비워도|나가 있어도) (될까|괜찮아|되나)"}
  rk_17:
    - {tone: 평서, text: "(국|찌개|라면) 넘칠 것 같은데 (괜찮나|괜찮아|봐 줘)"}

  # ---------------- EMERGENCY_STOP ----------------
  # 급한 말이 붙거나 "멈춰·정지"면 긴급 정지 (plan_sheet 주석과 같은 기준)
  em_01:
    - {tone: 명령, text: "(긴급|비상) (정지|멈춤)"}
    - {tone: 명령, text: "(지금|당장|빨리) (긴급 정지|비상 정지)"}
  em_02:
    - {tone: 명령, text: "(빨리|당장|얼른|지금) (멈춰|멈춰 봐|정지해)"}
  em_06:
    - {tone: 명령, text: "(당장|빨리|얼른|지금 당장) (다|전부|모두) (꺼|꺼 버려|멈춰)"}
  em_07:
    - {tone: 평서, text: "(불났어|불붙었어|불이 붙었어|연기 엄청 나) (빨리|당장) (다 꺼|멈춰)"}
  em_21:
    - {tone: 평서, text: "(큰일 났어|위험해|사고 났어) (다 멈춰|다 꺼)"}
  em_05:
    - {tone: 요청, text: "(빨리|당장|지금) (멈춰|정지해|다 꺼) 주세요"}
  em_09:
    - {tone: 명령, text: "(전부|다|모두) (정지|정지해|중지해)"}
  em_13:
    - {tone: 평서, text: "(비상|비상이야|비상 상황이야) (빨리|당장) (꺼|멈춰)"}
  em_23:
    - {tone: 평서, text: "(기름에|팬에|냄비에) 불 (붙었어|났어)"}
  em_27:
    - {tone: 명령, text: "(스톱|스탑|멈춰) (스톱|스탑|멈춰)"}

  # ---------------- ASK_CLARIFY ----------------
  ask_01:
    - {tone: 명령, text: "(불|화구|가스불) (좀 켜|켜 봐|켜 줄래)"}
  ask_02:
    - {tone: 명령, text: "(불|화구) (좀 꺼|꺼 봐|꺼 줄래)"}
  ask_04:
    - {tone: 명령, text: "(좀|더) (세게|강하게) (해 줘|해)"}
  ask_05:
    - {tone: 명령, text: "타이머 (좀 맞춰 줄래|설정해 줘|하나 맞춰 줘)"}
  ask_07:
    - {tone: 명령, text: "{device} (좀 더|조금만 더|더) (세게|강하게)"}
    - {tone: 요청, text: "{device} 한 단계 올려 줘"}
  ask_08:
    - {tone: 명령, text: "{device} (조금|살짝|좀 더) (줄여 줘|낮춰 줘)"}
  ask_09:
    - {tone: 명령, text: "(이거|저거|그거) (해 줘|해 봐|좀 해)"}
  ask_10:
    - {tone: 평서, text: "(잠깐|잠시만|저기|있잖아)"}

  # ---------------- UNSUPPORTED ----------------
  un_01:
    - {tone: 명령, text: "(오늘|내일|이번 주) 날씨 (어때|알려 줘)"}
  un_02:
    - {tone: 명령, text: "(노래|음악|발라드) (틀어 줘|좀 틀어|켜 줘)"}
  un_03:
    - {tone: 요청, text: "(된장찌개|파스타|계란말이) (레시피|만드는 법) 알려 줘"}
  un_04:
    - {tone: 명령, text: "(냉장고|냉동실|찬장) (문 닫아 줘|문 열어 줘)"}
  un_05:
    - {tone: 명령, text: "(전자레인지|에어프라이어|밥솥) (돌려 줘|켜 줘|작동시켜 줘)"}
  un_06:
    - {tone: 명령, text: "(지금|오늘) (몇 시야|며칠이야|무슨 요일이야)"}
  un_21:
    - {tone: 명령, text: "(넌|너) (뭐야|누구니|뭘 할 수 있어)"}
  un_22:
    - {tone: 평서, text: "(고마워|고마워요|수고했어|잘했어)"}
  un_23:
    - {tone: 평서, text: "(안녕|안녕하세요|좋은 아침)"}
  un_10:
    - {tone: 명령, text: "(뉴스|유튜브|드라마|영화) (틀어 줘|보여 줘|켜 줘)"}
  un_13:
    # 지원하지 않는 기기의 켜기·끄기 — TURN_ON/OFF와 헷갈리기 쉬운 경계
    - {tone: 명령, text: "(청소기|세탁기|건조기|식기세척기) (돌려 줘|켜 줘|꺼 줘)"}
  un_16:
    - {tone: 요청, text: "(커피|차|코코아) (내려 줘|타 줘)"}
  un_18:
    - {tone: 명령, text: "(계란|우유|양파) (몇 개 남았어|있어|떨어졌어)"}
  un_19:
    - {tone: 요청, text: "(칼로리|영양 성분|가격) (알려 줘|계산해 줘)"}
  un_20:
    - {tone: 요청, text: "(재밌는 얘기|농담|퀴즈) (해 줘|하나 해 줘)"}
  un_24:
    - {tone: 평서, text: "(배고프다|졸리다|피곤하다|힘들다)"}
  un_25:
    - {tone: 평서, text: "(오늘|저녁|점심) (뭐 먹지|뭐 해 먹을까|메뉴 추천해 줘)"}
  un_27:
    - {tone: 명령, text: "(창문|현관문|베란다 문) (열어 줘|닫아 줘|잠가 줘)"}
  un_31:
    # "줄여 줘"지만 대상이 볼륨 → 세기 조절이 아님
    - {tone: 명령, text: "(볼륨|소리) (키워 줘|줄여 줘|크게 해 줘)"}
  un_35:
    # 조명은 장치가 아님 ("불빛"은 화구가 아님)
    - {tone: 명령, text: "(조명|불빛|전등) (어둡게|밝게) 해 줘"}
  un_32:
    - {tone: 요청, text: "(오늘|내일) (일정|약속) (알려 줘|뭐 있어)"}
