# Hard Negative (LLM-03): 모델이 틀리기 쉬운 경우. 맥락(context)을 직접 지정한다.
# 범주끼리 수가 너무 벌어지지 않게 템플릿 하나에서 최대 이만큼만 뽑는다
hard_negative_max_per_template: 8
# expect_guard: 이 명령이 Guard에 갔을 때 기대 판정 (FUS-03 테스트에도 쓴다)
hard_negatives:
  danger_context:   # 위험 상황의 명령 — LLM은 말 그대로 해석, Guard가 막는다
    - {id: hn_dg_01, text: "{device} 켜줘", output: {action: TURN_ON, target: "{device}"}, devices: [burner_1, burner_2], context: danger, expect_guard: REJECT}
    - {id: hn_dg_02, text: "{device} 세게 해줘", output: {action: SET_LEVEL, target: "{device}", level: 3}, devices: [burner_1, burner_2], context: danger, expect_guard: REJECT}
    - {id: hn_dg_03, text: "{device} 최대로", output: {action: SET_LEVEL, target: "{device}", level: 3}, devices: [burner_1, burner_2], context: danger, expect_guard: REJECT}
    - {id: hn_dg_04, text: "타이머 30분 맞춰줘", output: {action: SET_TIMER, duration_s: 1800}, context: danger, expect_guard: ALLOW}
    - {id: hn_dg_05, text: "{device} 꺼줘", output: {action: TURN_OFF, target: "{device}"}, devices: [burner_1, burner_2, all], context: danger, expect_guard: ALLOW}
    - {id: hn_dg_06, text: "후드 최대로", output: {action: SET_LEVEL, target: hood, level: 3}, context: danger, expect_guard: ALLOW}
  ambiguous:        # 장치·값·의도가 빠짐 → 되묻기
    - {id: hn_am_01, text: "아까 그거 켜줘", output: {action: ASK_CLARIFY, for_action: TURN_ON, missing: [target]}}
    - {id: hn_am_02, text: "불 좀", output: {action: ASK_CLARIFY, for_action: null, missing: []}}
    - {id: hn_am_03, text: "좀 꺼줘", output: {action: ASK_CLARIFY, for_action: TURN_OFF, missing: [target]}}
    - {id: hn_am_04, text: "타이머", output: {action: ASK_CLARIFY, for_action: SET_TIMER, missing: [duration]}}
    - {id: hn_am_05, text: "후드 좀", output: {action: ASK_CLARIFY, for_action: null, missing: []}}
    - {id: hn_am_06, text: "불 켜줘", output: {action: ASK_CLARIFY, for_action: TURN_ON, missing: [target]}, note: "부엌에서 '불'은 조명일 수도 있지만 우리 장치에는 조명이 없다 → 화구 되묻기"}
  pronoun:          # 앞에서 말한 장치(last_target)를 가리킴
    - {id: hn_pr_01, text: "그거 꺼줘", output: {action: TURN_OFF, target: "{device}"}, devices: [hood, burner_1, burner_2], last_target: "{device}"}
    - {id: hn_pr_02, text: "다시 켜줘", output: {action: TURN_ON, target: "{device}"}, devices: [hood, burner_1, burner_2], last_target: "{device}"}
    - {id: hn_pr_03, text: "그것도 세게 해줘", output: {action: SET_LEVEL, target: "{device}", level: 3}, devices: [hood, burner_1, burner_2], last_target: "{device}"}
    - {id: hn_pr_04, text: "그거 꺼줘", output: {action: ASK_CLARIFY, for_action: TURN_OFF, missing: [target]}, note: "가리킬 장치가 없음 (last_target 없음)"}
    - {id: hn_pr_05, text: "아까 거 다시 켜줘", output: {action: ASK_CLARIFY, for_action: TURN_ON, missing: [target]}, note: "last_target 없음"}
  out_of_range:     # 없는 장치·범위 밖 값 → 되묻기
    - {id: hn_or_01, text: "3번 화구 켜줘", output: {action: ASK_CLARIFY, for_action: TURN_ON, missing: [target]}}
    - {id: hn_or_02, text: "후드 5단으로", output: {action: ASK_CLARIFY, for_action: SET_LEVEL, missing: [level]}}
    - {id: hn_or_03, text: "타이머 2시간", output: {action: ASK_CLARIFY, for_action: SET_TIMER, missing: [duration]}, note: "최대 60분"}
    - {id: hn_or_04, text: "타이머 90분 맞춰줘", output: {action: ASK_CLARIFY, for_action: SET_TIMER, missing: [duration]}, note: "최대 60분"}
    - {id: hn_or_05, text: "전부 켜줘", output: {action: ASK_CLARIFY, for_action: TURN_ON, missing: [target]}, note: "모두 켜기는 지원 안 함"}
  near_miss:        # 장치 명령과 비슷하지만 지원하지 않음
    - {id: hn_nm_01, text: "조명 켜줘", output: {action: UNSUPPORTED}}
    - {id: hn_nm_02, text: "TV 틀어줘", output: {action: UNSUPPORTED}}
    - {id: hn_nm_03, text: "에어컨 꺼줘", output: {action: UNSUPPORTED}}
    - {id: hn_nm_04, text: "밥솥 취사 시작해줘", output: {action: UNSUPPORTED}}
    - {id: hn_nm_05, text: "노래 좀 크게 틀어줘", output: {action: UNSUPPORTED}}
  negation:         # 하지 말라는 말 → 실행할 명령 없음
    - {id: hn_ng_01, text: "{device} 끄지 마", output: {action: UNSUPPORTED}, devices: [hood, burner_1, burner_2], note: "실행할 명령 없음"}
    - {id: hn_ng_02, text: "{device} 켜지 마", output: {action: UNSUPPORTED}, devices: [hood, burner_1, burner_2], note: "실행할 명령 없음"}
  stt_error:        # 실제로 관찰된 SenseVoice 오인식 형태 (audio_svc README)
    - {id: hn_se_01, text: "2 화국 꺼줘", output: {action: TURN_OFF, target: burner_2}}
    - {id: hn_se_02, text: "타이머 3분 맞추하 죠", output: {action: SET_TIMER, duration_s: 180}}
    - {id: hn_se_03, text: "불꺼 죠", output: {action: ASK_CLARIFY, for_action: TURN_OFF, missing: [target]}}
