  ASK_CLARIFY:
    - {id: ask_01, tone: 명령, text: "불 켜줘", output: {action: ASK_CLARIFY, for_action: TURN_ON, missing: [target]}}
    - {id: ask_02, tone: 명령, text: "화구 꺼줘", output: {action: ASK_CLARIFY, for_action: TURN_OFF, missing: [target]}}
    - {id: ask_03, tone: 요청, text: "불 좀 약하게 해 주세요", output: {action: ASK_CLARIFY, for_action: SET_LEVEL, missing: [target]}}
    - {id: ask_04, tone: 명령, text: "세게 해줘", output: {action: ASK_CLARIFY, for_action: SET_LEVEL, missing: [target]}}
    - {id: ask_05, tone: 명령, text: "타이머 맞춰줘", output: {action: ASK_CLARIFY, for_action: SET_TIMER, missing: [duration]}}
    - {id: ask_06, tone: 요청, text: "{device} 타이머 좀 맞춰 주세요", output: {action: ASK_CLARIFY, for_action: SET_TIMER, missing: [duration]}, devices: *timer}
    - {id: ask_07, tone: 명령, text: "{device} 조금 더 세게", output: {action: ASK_CLARIFY, for_action: SET_LEVEL, missing: [level]}, devices: *strength}
    - {id: ask_08, tone: 명령, text: "{device} 좀 줄여줘", output: {action: ASK_CLARIFY, for_action: SET_LEVEL, missing: [level]}, devices: *each}
    - {id: ask_09, tone: 명령, text: "그거 해줘", output: {action: ASK_CLARIFY, for_action: null, missing: []}}
    - {id: ask_10, tone: 평서, text: "잠깐만", output: {action: ASK_CLARIFY, for_action: null, missing: []}}
    # v2: 되묻기 종류마다 가족을 여럿 둔다. v1은 "세기 빠짐"(ask_07·08)만 train에 있고 나머지 종류는
    # val·test에만 있어서, v1으로 배운 모델이 장치·시간을 되묻는 법을 볼 수 없었다
    # -- 켜기: 어느 장치인지 없음
    - {id: ask_18, tone: 명령, text: "켜줘", output: {action: ASK_CLARIFY, for_action: TURN_ON, missing: [target]}}
    - {id: ask_19, tone: 요청, text: "가스불 켜 주세요", output: {action: ASK_CLARIFY, for_action: TURN_ON, missing: [target]}}
    - {id: ask_20, tone: 평서, text: "버너 켜야겠다", output: {action: ASK_CLARIFY, for_action: TURN_ON, missing: [target]}}
    # -- 끄기: 어느 장치인지 없음
    - {id: ask_21, tone: 요청, text: "가스불 꺼 주세요", output: {action: ASK_CLARIFY, for_action: TURN_OFF, missing: [target]}}
    - {id: ask_22, tone: 평서, text: "버너 꺼야겠다", output: {action: ASK_CLARIFY, for_action: TURN_OFF, missing: [target]}}
    - {id: ask_23, tone: 명령, text: "꺼줘", output: {action: ASK_CLARIFY, for_action: TURN_OFF, missing: [target]}}
    # -- 세기: 어느 장치인지 없음
    - {id: ask_24, tone: 명령, text: "화구 {level} 해줘", output: {action: ASK_CLARIFY, for_action: SET_LEVEL, missing: [target]}}
    - {id: ask_25, tone: 명령, text: "불 좀 {level}", output: {action: ASK_CLARIFY, for_action: SET_LEVEL, missing: [target]}}
    - {id: ask_26, tone: 명령, text: "{level} 맞춰 줘", output: {action: ASK_CLARIFY, for_action: SET_LEVEL, missing: [target]}}
    # -- 타이머: 무엇을 끌지 없음 (몇 번 화구인지)
    - {id: ask_11, tone: 명령, text: "{time} 뒤에 화구 꺼줘", output: {action: ASK_CLARIFY, for_action: SET_TIMER, missing: [target]}}
    - {id: ask_27, tone: 명령, text: "불 {time}만 켜 두고 꺼줘", output: {action: ASK_CLARIFY, for_action: SET_TIMER, missing: [target]}}
    - {id: ask_28, tone: 요청, text: "{time} 있다가 가스불 꺼 주세요", output: {action: ASK_CLARIFY, for_action: SET_TIMER, missing: [target]}}
    # -- 타이머: 시간이 없음
    - {id: ask_12, tone: 명령, text: "{device} 이따가 꺼줘", output: {action: ASK_CLARIFY, for_action: SET_TIMER, missing: [duration]}, devices: *timer_all}
    - {id: ask_29, tone: 요청, text: "조금 있다가 알려줘", output: {action: ASK_CLARIFY, for_action: SET_TIMER, missing: [duration]}}
    # -- 세기: 조명 밝기·음악 음량의 상대 조절 ("더")
    - {id: ask_13, tone: 명령, text: "{device} 좀 더 밝게", output: {action: ASK_CLARIFY, for_action: SET_LEVEL, missing: [level]}, devices: [light]}
    - {id: ask_14, tone: 명령, text: "{device} 좀 더 크게", output: {action: ASK_CLARIFY, for_action: SET_LEVEL, missing: [level]}, devices: [music]}
    - {id: ask_15, tone: 명령, text: "볼륨 좀 키워줘", output: {action: ASK_CLARIFY, for_action: SET_LEVEL, missing: [level]}}
    # -- 무엇을 하려는지 모름
    - {id: ask_16, tone: 평서, text: "{device}", output: {action: ASK_CLARIFY, for_action: null, missing: []}, devices: *each}
    - {id: ask_17, tone: 요청, text: "{device} 좀 어떻게 해 줘", output: {action: ASK_CLARIFY, for_action: null, missing: []}, devices: *each}
    - {id: ask_30, tone: 평서, text: "어 그러니까", output: {action: ASK_CLARIFY, for_action: null, missing: []}}
