# LLM 데이터 기획 시트 v2 (LLM-02 Seed · LLM-03 Hard Negative · LLM-14 장치 8종·결제)
#
# SUDA 방식 (docs/school-materials.md): 기능별 키워드 목록 + 어투 3종(명령·요청·평서) + 데이터 비율.
# build_seed.py가 이 시트로 데이터를 만든다. 사람이 고치는 곳은 이 파일이다.
#
# - 입력(instruction)은 호출어를 뺀 명령 문장이다 (llm_svc가 split_wake 결과를 넘긴다).
# - 정답(output)은 interfaces §3 버스 JSON. "{device}" "{level}" "{time}"은 슬롯 값으로 채운다.
# - 템플릿 id는 학습/평가 분할(LLM-05)의 그룹 단위다. 한번 쓴 id는 뜻을 바꾸지 않는다.
#   정답이 바뀐 템플릿은 지우고 새 id로 만든다 (v2에서 지운 것: un_02 · un_31 · un_35 ·
#   hn_nm_01 · hn_nm_03 · hn_nm_05 — 조명·에어컨·음악이 장치가 되면서 "지원 외"가 아니게 됨).
# - 위험 상황의 위험 명령도 정답은 말 그대로의 명령이다. 막는 것은 Safety Guard (결정 #55).
# - 스키마에 없는 값·조합을 말했을 때: 되물어서 풀리면 되묻기("후드 5단" → 세기 되묻기),
#   되물어도 풀리지 않으면 지원 외("10분 뒤에 에어컨 꺼줘" — 에어컨에는 타이머가 없다).

seed: 0

# 장치를 부르는 말 (target → 표현). 숫자 표기 변형 포함 ("1번"/"일번"/"첫 번째")
devices:
  hood: [후드, 환풍기, 환기팬, 후드 팬]
  burner_1: [1번 화구, 일번 화구, 첫 번째 화구, 1번 불, 첫 번째 불, 1번 버너]
  burner_2: [2번 화구, 이번 화구, 두 번째 화구, 2번 불, 두 번째 불, 2번 버너]
  fryer: [튀김기, 튀김 기계, 전기 튀김기]
  light: [조명, 전등, 매장 조명]
  aircon: [에어컨, 에어콘, 냉방]
  fan: [선풍기, 매장 선풍기]
  music: [음악, 노래, 배경 음악]
  all: [전부, 다, 모두, 전체]

# 템플릿의 devices에 쓰는 장치 묶음 (devices: *each 처럼 가져다 쓴다)
device_groups:
  each: &each [hood, burner_1, burner_2, fryer, light, aircon, fan, music]  # 개별 장치 8종
  heat: &heat [burner_1, burner_2, fryer]                # 가열 장치
  timer: &timer [hood, burner_1, burner_2, fryer]        # 타이머로 끌 수 있는 개별 장치
  timer_all: &timer_all [hood, burner_1, burner_2, fryer, all]
  store: &store [light, aircon, fan, music]              # 매장 장치 (타이머 없음)
  wind: &wind [hood, aircon, fan]                        # 바람이 나오는 장치 ("돌려")
  play: &play [hood, aircon, fan, music]                 # "틀어"라고 말하는 장치
  strength: &strength [hood, burner_1, burner_2, fryer, aircon, fan]  # "세게·약하게"로 말하는 장치

# 세기 (level → 표현)
levels:
  1: [약하게, 약으로, 1단으로, 일단으로, 제일 약하게]
  2: [중간으로, 보통으로, 2단으로, 이단으로, 중으로]
  3: [세게, 강하게, 최대로, 3단으로, 제일 세게]

# 세기를 다르게 말하는 장치 (없으면 위의 levels). 조명은 밝기, 음악은 음량 — 값은 똑같이 1~3
device_levels:
  light:
    1: [어둡게, 1단으로, 일단으로, 제일 어둡게]
    2: [중간으로, 보통으로, 2단으로, 중간 밝기로]
    3: [밝게, 환하게, 최대로, 3단으로, 제일 밝게]
  music:
    1: [작게, 조용하게, 1단으로, 제일 작게]
    2: [중간으로, 보통으로, 2단으로, 중간 크기로]
    3: [크게, 최대로, 3단으로, 제일 크게]

# 시간 (초 → 표현). 아라비아 숫자와 한글 수 둘 다
# v2에서 13종 → 26종으로 늘렸다 (v1으로 시험 학습한 모델이 못 본 시간 값을 틀렸다)
times:
  10: [10초, 십 초]
  20: [20초, 이십 초]
  30: [30초, 삼십 초]
  45: [45초, 사십오 초]
  60: [1분, 일 분]
  75: [1분 15초, 일 분 십오 초]
  90: [1분 30초, 1분 반, 일 분 삼십 초]
  120: [2분, 이 분]
  150: [2분 30초, 2분 반]
  180: [3분, 삼 분]
  200: [3분 20초, 삼 분 이십 초]
  240: [4분, 사 분]
  300: [5분, 오 분]
  330: [5분 30초, 5분 반]
  360: [6분, 육 분]
  420: [7분, 칠 분]
  480: [8분, 팔 분]
  600: [10분, 십 분]
  720: [12분, 십이 분]
  900: [15분, 십오 분]
  1200: [20분, 이십 분]
  1500: [25분, 이십오 분]
  1800: [30분, 삼십 분]
  2400: [40분, 사십 분]
  3000: [50분, 오십 분]
  3600: [60분, 1시간, 한 시간]

# 맥락 (context). Seed는 평소 상황에서 고르게 뽑는다
contexts:
  normal:
    - {state: IDLE, temperature: 24, detected_objects: [], last_target: null}
    - {state: PREHEAT, temperature: 120, detected_objects: [pan, burner_on], last_target: null}
    - {state: COOKING, temperature: 175, detected_objects: [pan, burner_on, hand], last_target: null}
    - {state: COOKING, temperature: 95, detected_objects: [pot, burner_on, hand], last_target: null}
  danger:
    - {state: DANGER, temperature: 262, detected_objects: [pan, burner_on], last_target: null}
    - {state: UNATTENDED, temperature: 188, detected_objects: [pan, burner_on], last_target: null}

# Action별 목표 수량 (Seed 합계 880). 소수 Action은 LLM-04 Paraphrase에서 더 늘린다
# (문장이 고정된 템플릿만 있는 Action은 템플릿 수가 상한이다)
targets:
  TURN_ON: 130
  TURN_OFF: 130
  SET_LEVEL: 150
  SET_TIMER: 120
  CANCEL_TIMER: 40
  CHECK_STATUS: 70
  CHECK_RISK: 25
  EMERGENCY_STOP: 40
  ASK_CLARIFY: 80
  UNSUPPORTED: 40
  CHECK_AMOUNT: 12
  REQUEST_PAYMENT: 12
  CONFIRM: 12
  DENY: 12

# 템플릿: id · tone(명령/요청/평서) · text · output · devices(쓸 target, 생략 시 output에 맞게)
# {device_obj}는 을/를이 붙은 장치 이름 ("전부·다·모두·전체"에는 조사를 붙이지 않는다)
templates:
  TURN_ON:
    - {id: on_01, tone: 명령, text: "{device} 켜줘", output: {action: TURN_ON, target: "{device}"}, devices: *each}
    - {id: on_02, tone: 명령, text: "{device} 켜", output: {action: TURN_ON, target: "{device}"}, devices: *each}
    - {id: on_03, tone: 요청, text: "{device_obj} 켜 주세요", output: {action: TURN_ON, target: "{device}"}, devices: *each}
    - {id: on_04, tone: 요청, text: "{device_obj} 좀 켜 줄래", output: {action: TURN_ON, target: "{device}"}, devices: *each}
    - {id: on_05, tone: 평서, text: "{device_obj} 켜야겠다", output: {action: TURN_ON, target: "{device}"}, devices: *each}
    - {id: on_06, tone: 명령, text: "{device} 틀어줘", output: {action: TURN_ON, target: "{device}"}, devices: *play}
    - {id: on_07, tone: 요청, text: "{device} 좀 돌려 주세요", output: {action: TURN_ON, target: "{device}"}, devices: [hood, fan]}
    - {id: on_08, tone: 요청, text: "{device} 켜 줬으면 좋겠어", output: {action: TURN_ON, target: "{device}"}}
    - {id: on_09, tone: 명령, text: "{device} 가동해줘", output: {action: TURN_ON, target: "{device}"}, devices: [hood, fryer, aircon, fan]}
    - {id: on_ind_01, tone: 평서, text: "연기가 너무 많이 나", output: {action: TURN_ON, target: hood}, indirect: true}
    - {id: on_ind_02, tone: 평서, text: "냄새가 너무 심해", output: {action: TURN_ON, target: hood}, indirect: true}
    - {id: on_ind_03, tone: 요청, text: "환기 좀 시켜줘", output: {action: TURN_ON, target: hood}, indirect: true}
    - {id: on_ind_04, tone: 평서, text: "물 끓여야 하니까 {device_obj} 켜줘", output: {action: TURN_ON, target: "{device}"}, devices: [burner_1, burner_2], indirect: true}
    - {id: on_ind_05, tone: 평서, text: "더우니까 {device_obj} 켜줘", output: {action: TURN_ON, target: "{device}"}, devices: [aircon, fan], indirect: true}
    - {id: on_ind_06, tone: 평서, text: "매장이 너무 어두워", output: {action: TURN_ON, target: light}, indirect: true}
    - {id: on_ind_07, tone: 평서, text: "튀김 해야 하니까 {device_obj} 켜줘", output: {action: TURN_ON, target: "{device}"}, devices: [fryer], indirect: true}
    - {id: on_ind_08, tone: 평서, text: "매장이 너무 조용해 {device} 좀 틀어줘", output: {action: TURN_ON, target: "{device}"}, devices: [music], indirect: true}
  TURN_OFF:
    - {id: off_01, tone: 명령, text: "{device} 꺼줘", output: {action: TURN_OFF, target: "{device}"}}
    - {id: off_02, tone: 명령, text: "{device} 꺼", output: {action: TURN_OFF, target: "{device}"}}
    - {id: off_03, tone: 요청, text: "{device_obj} 꺼 주세요", output: {action: TURN_OFF, target: "{device}"}}
    - {id: off_04, tone: 요청, text: "{device_obj} 좀 꺼 줄래", output: {action: TURN_OFF, target: "{device}"}}
    - {id: off_05, tone: 평서, text: "{device_obj} 꺼야겠다", output: {action: TURN_OFF, target: "{device}"}}
    - {id: off_06, tone: 명령, text: "{device} 끄자", output: {action: TURN_OFF, target: "{device}"}}
    - {id: off_ind_01, tone: 평서, text: "이제 환기 그만해도 돼", output: {action: TURN_OFF, target: hood}, indirect: true}
    - {id: off_ind_02, tone: 평서, text: "요리 다 끝났어 불 다 꺼도 돼", output: {action: TURN_OFF, target: all}, indirect: true}
    - {id: off_ind_03, tone: 평서, text: "다 먹었으니까 전부 꺼도 돼", output: {action: TURN_OFF, target: all}, indirect: true}
    - {id: off_ind_04, tone: 평서, text: "이제 시원해 {device} 꺼도 돼", output: {action: TURN_OFF, target: "{device}"}, devices: [aircon, fan], indirect: true}
    - {id: off_ind_05, tone: 평서, text: "너무 시끄러워 {device} 꺼줘", output: {action: TURN_OFF, target: "{device}"}, devices: [music], indirect: true}
    - {id: off_ind_06, tone: 평서, text: "마감이야 전부 꺼줘", output: {action: TURN_OFF, target: all}, indirect: true}
    - {id: off_ind_07, tone: 평서, text: "튀김 다 했어 {device} 꺼줘", output: {action: TURN_OFF, target: "{device}"}, devices: [fryer], indirect: true}
  SET_LEVEL:
    - {id: lv_01, tone: 명령, text: "{device} {level} 해줘", output: {action: SET_LEVEL, target: "{device}", level: "{level}"}, devices: *each}
    - {id: lv_02, tone: 명령, text: "{device} {level}", output: {action: SET_LEVEL, target: "{device}", level: "{level}"}, devices: *each}
    - {id: lv_03, tone: 요청, text: "{device_obj} {level} 해 주세요", output: {action: SET_LEVEL, target: "{device}", level: "{level}"}, devices: *each}
    - {id: lv_04, tone: 요청, text: "{device} 좀 {level} 해 줄래", output: {action: SET_LEVEL, target: "{device}", level: "{level}"}, devices: *each}
    - {id: lv_05, tone: 평서, text: "{device} {level} 해야겠다", output: {action: SET_LEVEL, target: "{device}", level: "{level}"}, devices: *each}
    - {id: lv_ind_01, tone: 평서, text: "연기가 계속 나 후드 최대로", output: {action: SET_LEVEL, target: hood, level: 3}, indirect: true}
    - {id: lv_ind_02, tone: 평서, text: "넘칠 것 같아 {device} 약하게", output: {action: SET_LEVEL, target: "{device}", level: 1}, devices: [burner_1, burner_2], indirect: true}
    - {id: lv_06, tone: 명령, text: "{device} {level} 틀어줘", output: {action: SET_LEVEL, target: "{device}", level: "{level}"}, devices: *play}
    # "볼륨·소리"는 음악의 음량이다 (소리를 내는 장치가 음악뿐)
    - {id: lv_vol_01, tone: 명령, text: "볼륨 {level} 해줘", output: {action: SET_LEVEL, target: music, level: "{level}"}}
    - {id: lv_vol_02, tone: 명령, text: "소리 {level} 해줘", output: {action: SET_LEVEL, target: music, level: "{level}"}}
    - {id: lv_ind_03, tone: 평서, text: "손님이 어둡대 조명 밝게 해줘", output: {action: SET_LEVEL, target: light, level: 3}, indirect: true}
    - {id: lv_ind_04, tone: 평서, text: "너무 시끄러워 음악 작게 해줘", output: {action: SET_LEVEL, target: music, level: 1}, indirect: true}
    - {id: lv_ind_05, tone: 평서, text: "너무 추워 에어컨 약하게 해줘", output: {action: SET_LEVEL, target: aircon, level: 1}, indirect: true}
    - {id: lv_ind_06, tone: 평서, text: "기름 온도 올려야 해 튀김기 세게", output: {action: SET_LEVEL, target: fryer, level: 3}, indirect: true}
  SET_TIMER:
    - {id: tm_01, tone: 명령, text: "타이머 {time}", output: {action: SET_TIMER, duration_s: "{time}"}}
    - {id: tm_02, tone: 명령, text: "타이머 {time} 맞춰줘", output: {action: SET_TIMER, duration_s: "{time}"}}
    - {id: tm_03, tone: 요청, text: "{time} 타이머 맞춰 주세요", output: {action: SET_TIMER, duration_s: "{time}"}}
    - {id: tm_04, tone: 요청, text: "{time} 있다가 알려줘", output: {action: SET_TIMER, duration_s: "{time}"}}
    - {id: tm_05, tone: 평서, text: "{time}만 재야겠다", output: {action: SET_TIMER, duration_s: "{time}"}}
    - {id: tm_06, tone: 명령, text: "{time} 뒤에 {device} 꺼줘", output: {action: SET_TIMER, duration_s: "{time}", target: "{device}"}}
    - {id: tm_07, tone: 요청, text: "{time} 있다가 {device_obj} 꺼 주세요", output: {action: SET_TIMER, duration_s: "{time}", target: "{device}"}}
    - {id: tm_08, tone: 명령, text: "{device} {time} 뒤에 꺼", output: {action: SET_TIMER, duration_s: "{time}", target: "{device}"}}
    - {id: tm_09, tone: 명령, text: "{time} 타이머", output: {action: SET_TIMER, duration_s: "{time}"}}
    - {id: tm_10, tone: 요청, text: "{time} 뒤에 {device} 좀 꺼 줄래", output: {action: SET_TIMER, duration_s: "{time}", target: "{device}"}}
    - {id: tm_ind_01, tone: 평서, text: "라면 끓일 거야 3분 재줘", output: {action: SET_TIMER, duration_s: 180}, indirect: true}
    - {id: tm_ind_02, tone: 평서, text: "계란 반숙으로 7분만 알려줘", output: {action: SET_TIMER, duration_s: 420}, indirect: true}
    - {id: tm_ind_03, tone: 평서, text: "치킨 튀길 거야 {time} 뒤에 {device} 꺼줘", output: {action: SET_TIMER, duration_s: "{time}", target: "{device}"}, devices: [fryer], indirect: true}
    - {id: tm_ind_04, tone: 평서, text: "계란 삶을 거야 {time} 뒤에 알려줘", output: {action: SET_TIMER, duration_s: "{time}"}, indirect: true}
    - {id: tm_ind_05, tone: 평서, text: "찌개 올렸어 {time} 뒤에 {device} 꺼줘", output: {action: SET_TIMER, duration_s: "{time}", target: "{device}"}, devices: [burner_1, burner_2], indirect: true}
  CANCEL_TIMER:
    - {id: ct_01, tone: 명령, text: "타이머 취소", output: {action: CANCEL_TIMER}}
    - {id: ct_02, tone: 명령, text: "타이머 꺼줘", output: {action: CANCEL_TIMER}}
    - {id: ct_03, tone: 요청, text: "타이머 취소해 주세요", output: {action: CANCEL_TIMER}}
    - {id: ct_04, tone: 평서, text: "타이머 이제 안 해도 돼", output: {action: CANCEL_TIMER}}
    - {id: ct_05, tone: 명령, text: "알람 그만", output: {action: CANCEL_TIMER}}
    - {id: ct_06, tone: 명령, text: "{device} 타이머 취소해줘", output: {action: CANCEL_TIMER, target: "{device}"}, devices: *timer}
    - {id: ct_07, tone: 명령, text: "타이머 멈춰", output: {action: CANCEL_TIMER}}
    - {id: ct_08, tone: 명령, text: "타이머 없애줘", output: {action: CANCEL_TIMER}}
    - {id: ct_09, tone: 명령, text: "타이머 지워줘", output: {action: CANCEL_TIMER}}
    - {id: ct_10, tone: 명령, text: "알람 꺼", output: {action: CANCEL_TIMER}}
    - {id: ct_11, tone: 요청, text: "알람 꺼 주세요", output: {action: CANCEL_TIMER}}
    - {id: ct_12, tone: 평서, text: "타이머 취소할게", output: {action: CANCEL_TIMER}}
    - {id: ct_13, tone: 명령, text: "맞춰 둔 타이머 취소해", output: {action: CANCEL_TIMER}}
    - {id: ct_14, tone: 평서, text: "타이머 그만해도 돼", output: {action: CANCEL_TIMER}}
  CHECK_STATUS:
    - {id: st_01, tone: 명령, text: "{device} 켜져 있어", output: {action: CHECK_STATUS, target: "{device}"}, devices: *each}
    - {id: st_02, tone: 명령, text: "{device} 꺼졌어", output: {action: CHECK_STATUS, target: "{device}"}, devices: *each}
    - {id: st_03, tone: 요청, text: "{device} 상태 알려 주세요", output: {action: CHECK_STATUS, target: "{device}"}, devices: *each}
    - {id: st_04, tone: 명령, text: "지금 뭐 켜져 있어", output: {action: CHECK_STATUS}}
    - {id: st_05, tone: 명령, text: "상태 알려줘", output: {action: CHECK_STATUS}}
