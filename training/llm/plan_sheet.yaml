    - {id: em_28, tone: 명령, text: "당장 멈춰", output: {action: EMERGENCY_STOP, target: all}}
    - {id: em_29, tone: 평서, text: "불붙었어 빨리 꺼", output: {action: EMERGENCY_STOP, target: all}}
