  ASK_CLARIFY:
    - {id: ask_01, tone: 명령, text: "불 켜줘", output: {action: ASK_CLARIFY, for_action: TURN_ON, missing: [target]}}
    - {id: ask_02, tone: 명령, text: "화구 꺼줘", output: {action: ASK_CLARIFY, for_action: TURN_OFF, missing: [target]}}
    - {id: ask_03, tone: 요청, text: "불 좀 약하게 해 주세요", output: {action: ASK_CLARIFY, for_action: SET_LEVEL, missing: [target]}}
    - {id: ask_04, tone: 명령, text: "세게 해줘", output: {action: ASK_CLARIFY, for_action: SET_LEVEL, missing: [target]}}
    - {id: ask_05, tone: 명령, text: "타이머 맞춰줘", output: {action: ASK_CLARIFY, for_action: SET_TIMER, missing: [duration]}}
    - {id: ask_06, tone: 요청, text: "{device} 타이머 좀 맞춰 주세요", output: {action: ASK_CLARIFY, for_action: SET_TIMER, missing: [duration]}, devices: [hood, burner_1, burner_2]}
    - {id: ask_07, tone: 명령, text: "{device} 조금 더 세게", output: {action: ASK_CLARIFY, for_action: SET_LEVEL, missing: [level]}, devices: [hood, burner_1, burner_2]}
    - {id: ask_08, tone: 명령, text: "{device} 좀 줄여줘", output: {action: ASK_CLARIFY, for_action: SET_LEVEL, missing: [level]}, devices: [hood, burner_1, burner_2]}
    - {id: ask_09, tone: 명령, text: "그거 해줘", output: {action: ASK_CLARIFY, for_action: null, missing: []}}
    - {id: ask_10, tone: 평서, text: "잠깐만", output: {action: ASK_CLARIFY, for_action: null, missing: []}}
  UNSUPPORTED:
    # 지원하지 않는 기기·기능, 잡담(SUDA의 General_Conversation). "알람 7시"는 시각 알람이라 타이머가 아님.
