    - {id: pay_04, tone: 명령, text: "카드 결제해줘", output: {action: REQUEST_PAYMENT}}
    - {id: pay_05, tone: 명령, text: "계산해줘", output: {action: REQUEST_PAYMENT}}
    - {id: pay_06, tone: 요청, text: "계산 좀 해 주세요", output: {action: REQUEST_PAYMENT}}
    - {id: pay_07, tone: 요청, text: "결제 좀 부탁해", output: {action: REQUEST_PAYMENT}}
    - {id: pay_08, tone: 평서, text: "손님 계산하신대", output: {action: REQUEST_PAYMENT}, indirect: true}
    - {id: pay_09, tone: 명령, text: "결제 받아줘", output: {action: REQUEST_PAYMENT}}
    - {id: pay_10, tone: 명령, text: "결제 시작해", output: {action: REQUEST_PAYMENT}}
    - {id: pay_11, tone: 평서, text: "이제 결제해야겠다", output: {action: REQUEST_PAYMENT}}
    - {id: pay_12, tone: 명령, text: "카드로 계산해줘", output: {action: REQUEST_PAYMENT}}
  CONFIRM:
    # "네" — 기다리는 질문이 있는지는 Safety Guard가 본다. LLM은 말 그대로 CONFIRM
    - {id: yes_01, tone: 평서, text: "네", output: {action: CONFIRM}}
    - {id: yes_02, tone: 평서, text: "응", output: {action: CONFIRM}}
    - {id: yes_03, tone: 평서, text: "그래", output: {action: CONFIRM}}
    - {id: yes_04, tone: 평서, text: "맞아", output: {action: CONFIRM}}
    - {id: yes_05, tone: 평서, text: "좋아", output: {action: CONFIRM}}
    - {id: yes_06, tone: 평서, text: "예", output: {action: CONFIRM}}
    - {id: yes_07, tone: 명령, text: "응 해줘", output: {action: CONFIRM}}
    - {id: yes_08, tone: 평서, text: "네 맞아요", output: {action: CONFIRM}}
    - {id: yes_09, tone: 명령, text: "그렇게 해줘", output: {action: CONFIRM}}
    - {id: yes_10, tone: 평서, text: "오케이", output: {action: CONFIRM}}
    - {id: yes_11, tone: 요청, text: "네 진행해 주세요", output: {action: CONFIRM}}
    - {id: yes_12, tone: 평서, text: "어 그래", output: {action: CONFIRM}}
  DENY:
    # "아니요". "취소"만 말하면 거절이고, "타이머 취소"는 타이머 취소다
    - {id: no_01, tone: 평서, text: "아니", output: {action: DENY}}
    - {id: no_02, tone: 평서, text: "아니요", output: {action: DENY}}
    - {id: no_03, tone: 평서, text: "아니야", output: {action: DENY}}
    - {id: no_04, tone: 평서, text: "싫어", output: {action: DENY}}
    - {id: no_05, tone: 명령, text: "하지 마", output: {action: DENY}}
    - {id: no_06, tone: 명령, text: "취소", output: {action: DENY}}
    - {id: no_07, tone: 평서, text: "됐어", output: {action: DENY}}
    - {id: no_08, tone: 평서, text: "아니 됐어", output: {action: DENY}}
    - {id: no_09, tone: 평서, text: "안 해", output: {action: DENY}}
    - {id: no_10, tone: 평서, text: "아니요 괜찮아요", output: {action: DENY}}
    - {id: no_11, tone: 요청, text: "취소해 주세요", output: {action: DENY}}
    - {id: no_12, tone: 명령, text: "그러지 마", output: {action: DENY}}

# Hard Negative (LLM-03): 모델이 틀리기 쉬운 경우. 맥락(context)을 직접 지정한다.
# 범주끼리 수가 너무 벌어지지 않게 템플릿 하나에서 최대 이만큼만 뽑는다
hard_negative_max_per_template: 8
# expect_guard: 이 명령이 Guard에 갔을 때 기대 판정 (FUS-03 테스트에도 쓴다)
hard_negatives:
  danger_context:   # 위험 상황의 명령 — LLM은 말 그대로 해석, Guard가 막는다 (가열 장치: 화구·튀김기)
    - {id: hn_dg_01, text: "{device} 켜줘", output: {action: TURN_ON, target: "{device}"}, devices: *heat, context: danger, expect_guard: REJECT}
    - {id: hn_dg_02, text: "{device} 세게 해줘", output: {action: SET_LEVEL, target: "{device}", level: 3}, devices: *heat, context: danger, expect_guard: REJECT}
    - {id: hn_dg_03, text: "{device} 최대로", output: {action: SET_LEVEL, target: "{device}", level: 3}, devices: *heat, context: danger, expect_guard: REJECT}
    - {id: hn_dg_04, text: "타이머 30분 맞춰줘", output: {action: SET_TIMER, duration_s: 1800}, context: danger, expect_guard: ALLOW}
    - {id: hn_dg_05, text: "{device} 꺼줘", output: {action: TURN_OFF, target: "{device}"}, devices: [burner_1, burner_2, fryer, all], context: danger, expect_guard: ALLOW}
    - {id: hn_dg_06, text: "후드 최대로", output: {action: SET_LEVEL, target: hood, level: 3}, context: danger, expect_guard: ALLOW}
  ambiguous:        # 장치·값·의도가 빠짐 → 되묻기
    - {id: hn_am_01, text: "아까 그거 켜줘", output: {action: ASK_CLARIFY, for_action: TURN_ON, missing: [target]}}
    - {id: hn_am_02, text: "불 좀", output: {action: ASK_CLARIFY, for_action: null, missing: []}}
    - {id: hn_am_03, text: "좀 꺼줘", output: {action: ASK_CLARIFY, for_action: TURN_OFF, missing: [target]}}
    - {id: hn_am_04, text: "타이머", output: {action: ASK_CLARIFY, for_action: SET_TIMER, missing: [duration]}}
    - {id: hn_am_05, text: "후드 좀", output: {action: ASK_CLARIFY, for_action: null, missing: []}}
    - {id: hn_am_06, text: "불 켜줘", output: {action: ASK_CLARIFY, for_action: TURN_ON, missing: [target]}, note: "'불'은 화구 1·2번일 수도, 조명일 수도 있다 → 장치 되묻기"}
    - {id: hn_am_07, text: "{time} 뒤에 꺼줘", output: {action: ASK_CLARIFY, for_action: SET_TIMER, missing: [target]}, note: "무엇을 끌지 없음 (알림만 원하면 '알려줘')"}
    - {id: hn_am_08, text: "불 꺼줘", output: {action: ASK_CLARIFY, for_action: TURN_OFF, missing: [target]}, note: "화구인지 조명인지 모름"}
  pronoun:          # 앞에서 말한 장치(last_target)를 가리킴
    - {id: hn_pr_01, text: "그거 꺼줘", output: {action: TURN_OFF, target: "{device}"}, devices: *each, last_target: "{device}"}
    - {id: hn_pr_02, text: "다시 켜줘", output: {action: TURN_ON, target: "{device}"}, devices: *each, last_target: "{device}"}
    - {id: hn_pr_03, text: "그것도 세게 해줘", output: {action: SET_LEVEL, target: "{device}", level: 3}, devices: *strength, last_target: "{device}"}
    - {id: hn_pr_04, text: "그거 꺼줘", output: {action: ASK_CLARIFY, for_action: TURN_OFF, missing: [target]}, note: "가리킬 장치가 없음 (last_target 없음)"}
    - {id: hn_pr_05, text: "아까 거 다시 켜줘", output: {action: ASK_CLARIFY, for_action: TURN_ON, missing: [target]}, note: "last_target 없음"}
  out_of_range:     # 없는 장치·범위 밖 값 → 되묻기 (되물으면 풀린다)
    - {id: hn_or_01, text: "3번 화구 켜줘", output: {action: ASK_CLARIFY, for_action: TURN_ON, missing: [target]}}
    - {id: hn_or_02, text: "후드 5단으로", output: {action: ASK_CLARIFY, for_action: SET_LEVEL, missing: [level]}}
    - {id: hn_or_03, text: "타이머 2시간", output: {action: ASK_CLARIFY, for_action: SET_TIMER, missing: [duration]}, note: "최대 60분"}
    - {id: hn_or_04, text: "타이머 90분 맞춰줘", output: {action: ASK_CLARIFY, for_action: SET_TIMER, missing: [duration]}, note: "최대 60분"}
    - {id: hn_or_05, text: "전부 켜줘", output: {action: ASK_CLARIFY, for_action: TURN_ON, missing: [target]}, note: "모두 켜기는 지원 안 함"}
    - {id: hn_or_06, text: "{device} 4단으로 해줘", output: {action: ASK_CLARIFY, for_action: SET_LEVEL, missing: [level]}, devices: *each, note: "세기는 1~3"}
    - {id: hn_or_07, text: "에어컨 24도로 맞춰줘", output: {action: ASK_CLARIFY, for_action: SET_LEVEL, missing: [level]}, note: "온도를 숫자로 받지 않는다 → 세기를 되묻는다"}
    - {id: hn_or_08, text: "에어컨 18도로 해줘", output: {action: ASK_CLARIFY, for_action: SET_LEVEL, missing: [level]}, note: "온도를 숫자로 받지 않는다"}
    - {id: hn_or_09, text: "볼륨 50으로 해줘", output: {action: ASK_CLARIFY, for_action: SET_LEVEL, missing: [level]}, note: "음량은 1~3"}
  near_miss:        # 장치 명령과 비슷하지만 지원하지 않음 (되물어도 풀리지 않는다)
    - {id: hn_nm_02, text: "TV 틀어줘", output: {action: UNSUPPORTED}}
    - {id: hn_nm_04, text: "밥솥 취사 시작해줘", output: {action: UNSUPPORTED}}
    - {id: hn_nm_06, text: "{time} 뒤에 {device} 꺼줘", output: {action: UNSUPPORTED}, devices: *store, note: "타이머는 가열 장치·후드·전체에만"}
    - {id: hn_nm_07, text: "다음 곡 틀어줘", output: {action: UNSUPPORTED}, note: "음악은 켜기·끄기·음량만"}
    - {id: hn_nm_08, text: "에어컨 제습으로 바꿔줘", output: {action: UNSUPPORTED}}
    - {id: hn_nm_09, text: "선풍기 회전시켜줘", output: {action: UNSUPPORTED}}
    - {id: hn_nm_10, text: "조명 색 바꿔줘", output: {action: UNSUPPORTED}}
    - {id: hn_nm_11, text: "에어프라이어 좀 켜줘", output: {action: UNSUPPORTED}, note: "튀김기와 다른 기기"}
    - {id: hn_nm_12, text: "오늘 매출 얼마야", output: {action: UNSUPPORTED}, note: "지금 결제할 금액이 아님"}
  negation:         # 하지 말라는 말 → 실행할 명령 없음
    - {id: hn_ng_01, text: "{device} 끄지 마", output: {action: UNSUPPORTED}, devices: *each, note: "실행할 명령 없음"}
    - {id: hn_ng_02, text: "{device} 켜지 마", output: {action: UNSUPPORTED}, devices: *each, note: "실행할 명령 없음"}
  not_urgent:       # 매장 장치를 멈추라는 말은 긴급 정지가 아니라 그 장치 끄기 ("멈춰"만 말하면 긴급 정지)
    - {id: hn_nu_01, text: "{device} 멈춰", output: {action: TURN_OFF, target: "{device}"}, devices: [aircon, fan, music]}
    - {id: hn_nu_02, text: "{device} 정지", output: {action: TURN_OFF, target: "{device}"}, devices: [fan, music]}
    - {id: hn_nu_03, text: "{device} 그만 틀어", output: {action: TURN_OFF, target: "{device}"}, devices: [aircon, fan, music]}
  payment:          # 결제: 말 속의 금액은 쓰지 않는다. 결제를 하지 말라는 말은 거절
    - {id: hn_pay_01, text: "만 이천 원 결제해줘", output: {action: REQUEST_PAYMENT}, note: "금액은 결제 단말의 값을 쓰고 Guard가 확인을 받는다"}
    - {id: hn_pay_02, text: "오천 원 계산해줘", output: {action: REQUEST_PAYMENT}, note: "금액은 말로 받지 않는다"}
    - {id: hn_pay_03, text: "결제 취소", output: {action: DENY}}
    - {id: hn_pay_04, text: "결제하지 마", output: {action: DENY}}
  filler:           # "응·아니"로 시작하지만 뒤에 명령이 있다 → 그 명령
    - {id: hn_fl_01, text: "응 {device} 꺼줘", output: {action: TURN_OFF, target: "{device}"}, devices: *each}
    - {id: hn_fl_02, text: "아니 {device} 켜줘", output: {action: TURN_ON, target: "{device}"}, devices: *each}
  stt_error:        # 실제로 관찰된 SenseVoice 오인식 형태 (audio_svc README)
    - {id: hn_se_01, text: "2 화국 꺼줘", output: {action: TURN_OFF, target: burner_2}}
    - {id: hn_se_02, text: "타이머 3분 맞추하 죠", output: {action: SET_TIMER, duration_s: 180}}
    - {id: hn_se_03, text: "불꺼 죠", output: {action: ASK_CLARIFY, for_action: TURN_OFF, missing: [target]}}
