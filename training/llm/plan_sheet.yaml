# LLM 데이터 기획 시트 v1 (LLM-02 Seed · LLM-03 Hard Negative)
#
# SUDA 방식 (docs/school-materials.md): 기능별 키워드 목록 + 어투 3종(명령·요청·평서) + 데이터 비율.
# build_seed.py가 이 시트로 데이터를 만든다. 사람이 고치는 곳은 이 파일이다.
#
# - 입력(instruction)은 호출어를 뺀 명령 문장이다 (llm_svc가 split_wake 결과를 넘긴다).
# - 정답(output)은 interfaces §3 버스 JSON. "{device}" "{level}" "{time}"은 슬롯 값으로 채운다.
# - 템플릿 id는 학습/평가 분할(LLM-05)의 그룹 단위다. 한번 쓴 id는 뜻을 바꾸지 않는다.
# - 위험 상황의 위험 명령도 정답은 말 그대로의 명령이다. 막는 것은 Safety Guard (결정 #55).

seed: 0

# 장치를 부르는 말 (target → 표현). 숫자 표기 변형 포함 ("1번"/"일번"/"첫 번째")
devices:
  hood: [후드, 환풍기, 환기팬, 후드 팬]
  burner_1: [1번 화구, 일번 화구, 첫 번째 화구, 1번 불, 첫 번째 불, 1번 버너]
  burner_2: [2번 화구, 이번 화구, 두 번째 화구, 2번 불, 두 번째 불, 2번 버너]
  all: [전부, 다, 모두, 전체]

# 세기 (level → 표현)
levels:
  1: [약하게, 약으로, 1단으로, 일단으로, 제일 약하게]
  2: [중간으로, 보통으로, 2단으로, 이단으로, 중으로]
  3: [세게, 강하게, 최대로, 3단으로, 제일 세게]

# 시간 (초 → 표현). 아라비아 숫자와 한글 수 둘 다
times:
  30: [30초, 삼십 초]
  45: [45초, 사십오 초]
  60: [1분, 일 분]
  90: [1분 30초, 1분 반, 일 분 삼십 초]
  120: [2분, 이 분]
  150: [2분 30초, 2분 반]
  180: [3분, 삼 분]
  300: [5분, 오 분]
  420: [7분, 칠 분]
  600: [10분, 십 분]
  900: [15분, 십오 분]
  1200: [20분, 이십 분]
  1800: [30분, 삼십 분]

# 맥락 (context). Seed는 평소 상황에서 고르게 뽑는다
contexts:
  normal:
    - {state: IDLE, temperature: 24, detected_objects: [], last_target: null}
    - {state: PREHEAT, temperature: 120, detected_objects: [pan, burner_on], last_target: null}
    - {state: COOKING, temperature: 175, detected_objects: [pan, burner_on, hand], last_target: null}
    - {state: COOKING, temperature: 95, detected_objects: [pot, burner_on, hand], last_target: null}
  danger:
    - {state: DANGER, temperature: 262, detected_objects: [pan, burner_on], last_target: null}
    - {state: UNATTENDED, temperature: 188, detected_objects: [pan, burner_on], last_target: null}

# Action별 목표 수량 (Seed 합계 660). 소수 Action은 LLM-04 Paraphrase에서 더 늘린다
targets:
  TURN_ON: 100
  TURN_OFF: 100
  SET_LEVEL: 110
  SET_TIMER: 110
  CANCEL_TIMER: 40
  CHECK_STATUS: 50
  CHECK_RISK: 25
  EMERGENCY_STOP: 40
  ASK_CLARIFY: 50
  UNSUPPORTED: 35

# 템플릿: id · tone(명령/요청/평서) · text · output · devices(쓸 target, 생략 시 output에 맞게)
# {device_obj}는 을/를이 붙은 장치 이름 ("전부·다·모두·전체"에는 조사를 붙이지 않는다)
templates:
  TURN_ON:
    - {id: on_01, tone: 명령, text: "{device} 켜줘", output: {action: TURN_ON, target: "{device}"}, devices: [hood, burner_1, burner_2]}
    - {id: on_02, tone: 명령, text: "{device} 켜", output: {action: TURN_ON, target: "{device}"}, devices: [hood, burner_1, burner_2]}
    - {id: on_03, tone: 요청, text: "{device_obj} 켜 주세요", output: {action: TURN_ON, target: "{device}"}, devices: [hood, burner_1, burner_2]}
    - {id: on_04, tone: 요청, text: "{device_obj} 좀 켜 줄래", output: {action: TURN_ON, target: "{device}"}, devices: [hood, burner_1, burner_2]}
    - {id: on_05, tone: 평서, text: "{device_obj} 켜야겠다", output: {action: TURN_ON, target: "{device}"}, devices: [hood, burner_1, burner_2]}
    - {id: on_06, tone: 명령, text: "{device} 틀어줘", output: {action: TURN_ON, target: "{device}"}, devices: [hood]}
    - {id: on_07, tone: 요청, text: "{device} 좀 돌려 주세요", output: {action: TURN_ON, target: "{device}"}, devices: [hood]}
    - {id: on_ind_01, tone: 평서, text: "연기가 너무 많이 나", output: {action: TURN_ON, target: hood}, indirect: true}
    - {id: on_ind_02, tone: 평서, text: "냄새가 너무 심해", output: {action: TURN_ON, target: hood}, indirect: true}
    - {id: on_ind_03, tone: 요청, text: "환기 좀 시켜줘", output: {action: TURN_ON, target: hood}, indirect: true}
    - {id: on_ind_04, tone: 평서, text: "물 끓여야 하니까 {device_obj} 켜줘", output: {action: TURN_ON, target: "{device}"}, devices: [burner_1, burner_2], indirect: true}
  TURN_OFF:
    - {id: off_01, tone: 명령, text: "{device} 꺼줘", output: {action: TURN_OFF, target: "{device}"}}
    - {id: off_02, tone: 명령, text: "{device} 꺼", output: {action: TURN_OFF, target: "{device}"}}
    - {id: off_03, tone: 요청, text: "{device_obj} 꺼 주세요", output: {action: TURN_OFF, target: "{device}"}}
    - {id: off_04, tone: 요청, text: "{device_obj} 좀 꺼 줄래", output: {action: TURN_OFF, target: "{device}"}}
    - {id: off_05, tone: 평서, text: "{device_obj} 꺼야겠다", output: {action: TURN_OFF, target: "{device}"}}
    - {id: off_06, tone: 명령, text: "{device} 끄자", output: {action: TURN_OFF, target: "{device}"}}
    - {id: off_ind_01, tone: 평서, text: "이제 환기 그만해도 돼", output: {action: TURN_OFF, target: hood}, indirect: true}
    - {id: off_ind_02, tone: 평서, text: "요리 다 끝났어 불 다 꺼도 돼", output: {action: TURN_OFF, target: all}, indirect: true}
    - {id: off_ind_03, tone: 평서, text: "다 먹었으니까 전부 꺼도 돼", output: {action: TURN_OFF, target: all}, indirect: true}
  SET_LEVEL:
    - {id: lv_01, tone: 명령, text: "{device} {level} 해줘", output: {action: SET_LEVEL, target: "{device}", level: "{level}"}, devices: [hood, burner_1, burner_2]}
    - {id: lv_02, tone: 명령, text: "{device} {level}", output: {action: SET_LEVEL, target: "{device}", level: "{level}"}, devices: [hood, burner_1, burner_2]}
    - {id: lv_03, tone: 요청, text: "{device_obj} {level} 해 주세요", output: {action: SET_LEVEL, target: "{device}", level: "{level}"}, devices: [hood, burner_1, burner_2]}
    - {id: lv_04, tone: 요청, text: "{device} 좀 {level} 해 줄래", output: {action: SET_LEVEL, target: "{device}", level: "{level}"}, devices: [hood, burner_1, burner_2]}
    - {id: lv_05, tone: 평서, text: "{device} {level} 해야겠다", output: {action: SET_LEVEL, target: "{device}", level: "{level}"}, devices: [hood, burner_1, burner_2]}
    - {id: lv_ind_01, tone: 평서, text: "연기가 계속 나 후드 최대로", output: {action: SET_LEVEL, target: hood, level: 3}, indirect: true}
    - {id: lv_ind_02, tone: 평서, text: "넘칠 것 같아 {device} 약하게", output: {action: SET_LEVEL, target: "{device}", level: 1}, devices: [burner_1, burner_2], indirect: true}
  SET_TIMER:
    - {id: tm_01, tone: 명령, text: "타이머 {time}", output: {action: SET_TIMER, duration_s: "{time}"}}
    - {id: tm_02, tone: 명령, text: "타이머 {time} 맞춰줘", output: {action: SET_TIMER, duration_s: "{time}"}}
    - {id: tm_03, tone: 요청, text: "{time} 타이머 맞춰 주세요", output: {action: SET_TIMER, duration_s: "{time}"}}
    - {id: tm_04, tone: 요청, text: "{time} 있다가 알려줘", output: {action: SET_TIMER, duration_s: "{time}"}}
    - {id: tm_05, tone: 평서, text: "{time}만 재야겠다", output: {action: SET_TIMER, duration_s: "{time}"}}
    - {id: tm_06, tone: 명령, text: "{time} 뒤에 {device} 꺼줘", output: {action: SET_TIMER, duration_s: "{time}", target: "{device}"}}
    - {id: tm_07, tone: 요청, text: "{time} 있다가 {device_obj} 꺼 주세요", output: {action: SET_TIMER, duration_s: "{time}", target: "{device}"}}
    - {id: tm_08, tone: 명령, text: "{device} {time} 뒤에 꺼", output: {action: SET_TIMER, duration_s: "{time}", target: "{device}"}}
    - {id: tm_ind_01, tone: 평서, text: "라면 끓일 거야 3분 재줘", output: {action: SET_TIMER, duration_s: 180}, indirect: true}
    - {id: tm_ind_02, tone: 평서, text: "계란 반숙으로 7분만 알려줘", output: {action: SET_TIMER, duration_s: 420}, indirect: true}
  CANCEL_TIMER:
    - {id: ct_01, tone: 명령, text: "타이머 취소", output: {action: CANCEL_TIMER}}
    - {id: ct_02, tone: 명령, text: "타이머 꺼줘", output: {action: CANCEL_TIMER}}
    - {id: ct_03, tone: 요청, text: "타이머 취소해 주세요", output: {action: CANCEL_TIMER}}
    - {id: ct_04, tone: 평서, text: "타이머 이제 안 해도 돼", output: {action: CANCEL_TIMER}}
    - {id: ct_05, tone: 명령, text: "알람 그만", output: {action: CANCEL_TIMER}}
    - {id: ct_06, tone: 명령, text: "{device} 타이머 취소해줘", output: {action: CANCEL_TIMER, target: "{device}"}, devices: [hood, burner_1, burner_2]}
    - {id: ct_07, tone: 명령, text: "타이머 멈춰", output: {action: CANCEL_TIMER}}
    - {id: ct_08, tone: 명령, text: "타이머 없애줘", output: {action: CANCEL_TIMER}}
    - {id: ct_09, tone: 명령, text: "타이머 지워줘", output: {action: CANCEL_TIMER}}
    - {id: ct_10, tone: 명령, text: "알람 꺼", output: {action: CANCEL_TIMER}}
    - {id: ct_11, tone: 요청, text: "알람 꺼 주세요", output: {action: CANCEL_TIMER}}
    - {id: ct_12, tone: 평서, text: "타이머 취소할게", output: {action: CANCEL_TIMER}}
    - {id: ct_13, tone: 명령, text: "맞춰 둔 타이머 취소해", output: {action: CANCEL_TIMER}}
    - {id: ct_14, tone: 평서, text: "타이머 그만해도 돼", output: {action: CANCEL_TIMER}}
  CHECK_STATUS:
    - {id: st_01, tone: 명령, text: "{device} 켜져 있어", output: {action: CHECK_STATUS, target: "{device}"}, devices: [hood, burner_1, burner_2]}
    - {id: st_02, tone: 명령, text: "{device} 꺼졌어", output: {action: CHECK_STATUS, target: "{device}"}, devices: [hood, burner_1, burner_2]}
    - {id: st_03, tone: 요청, text: "{device} 상태 알려 주세요", output: {action: CHECK_STATUS, target: "{device}"}, devices: [hood, burner_1, burner_2]}
    - {id: st_04, tone: 명령, text: "지금 뭐 켜져 있어", output: {action: CHECK_STATUS}}
    - {id: st_05, tone: 명령, text: "상태 알려줘", output: {action: CHECK_STATUS}}
    - {id: st_06, tone: 요청, text: "다 꺼졌는지 확인해 주세요", output: {action: CHECK_STATUS, target: all}}
  CHECK_RISK:
    - {id: rk_01, tone: 명령, text: "지금 위험해", output: {action: CHECK_RISK}}
    - {id: rk_02, tone: 요청, text: "안전한지 봐 주세요", output: {action: CHECK_RISK}}
    - {id: rk_03, tone: 명령, text: "위험한 거 없어", output: {action: CHECK_RISK}}
    - {id: rk_04, tone: 명령, text: "지금 안전해", output: {action: CHECK_RISK}}
    - {id: rk_05, tone: 요청, text: "위험한 상황인지 확인해 주세요", output: {action: CHECK_RISK}}
    - {id: rk_06, tone: 평서, text: "불 옆에 아무도 없는데 괜찮나", output: {action: CHECK_RISK}}
    - {id: rk_07, tone: 명령, text: "위험한 거 있어", output: {action: CHECK_RISK}}
    - {id: rk_08, tone: 명령, text: "불 괜찮아", output: {action: CHECK_RISK}}
    - {id: rk_09, tone: 명령, text: "괜찮은 거 맞아", output: {action: CHECK_RISK}}
    - {id: rk_10, tone: 명령, text: "지금 위험한 상황이야", output: {action: CHECK_RISK}}
    - {id: rk_11, tone: 명령, text: "과열된 거 아니야", output: {action: CHECK_RISK}}
    - {id: rk_12, tone: 명령, text: "너무 뜨거운 거 아니야", output: {action: CHECK_RISK}}
    - {id: rk_13, tone: 명령, text: "기름 온도 괜찮아", output: {action: CHECK_RISK}}
    - {id: rk_14, tone: 요청, text: "안전 점검해 주세요", output: {action: CHECK_RISK}}
    - {id: rk_15, tone: 평서, text: "타는 거 아니지", output: {action: CHECK_RISK}}
    - {id: rk_16, tone: 요청, text: "자리 비워도 되는지 봐 줘", output: {action: CHECK_RISK}}
    - {id: rk_17, tone: 평서, text: "냄비 넘칠 것 같은데 괜찮나", output: {action: CHECK_RISK}}
    - {id: rk_18, tone: 명령, text: "위험 요소 있어", output: {action: CHECK_RISK}}
    - {id: rk_19, tone: 요청, text: "불 안전한지 확인해 줄래", output: {action: CHECK_RISK}}
  EMERGENCY_STOP:
    # 급한 말("당장·빨리·불났어·위험해")이 붙거나 "멈춰·정지"면 긴급 정지. 그냥 "다 꺼줘"는 TURN_OFF all
    - {id: em_01, tone: 명령, text: "긴급 정지", output: {action: EMERGENCY_STOP, target: all}}
    - {id: em_02, tone: 명령, text: "멈춰", output: {action: EMERGENCY_STOP, target: all}}
    - {id: em_03, tone: 명령, text: "그만", output: {action: EMERGENCY_STOP, target: all}}
    - {id: em_04, tone: 명령, text: "다 멈춰", output: {action: EMERGENCY_STOP, target: all}}
    - {id: em_05, tone: 요청, text: "비상 정지해 주세요", output: {action: EMERGENCY_STOP, target: all}}
    - {id: em_06, tone: 명령, text: "당장 다 꺼", output: {action: EMERGENCY_STOP, target: all}}
    - {id: em_07, tone: 평서, text: "불났어 다 꺼", output: {action: EMERGENCY_STOP, target: all}}
    - {id: em_08, tone: 명령, text: "스톱", output: {action: EMERGENCY_STOP, target: all}}
    - {id: em_09, tone: 명령, text: "정지해", output: {action: EMERGENCY_STOP, target: all}}
    - {id: em_10, tone: 명령, text: "빨리 멈춰", output: {action: EMERGENCY_STOP, target: all}}
    - {id: em_11, tone: 명령, text: "얼른 다 꺼", output: {action: EMERGENCY_STOP, target: all}}
    - {id: em_12, tone: 평서, text: "위험해 다 꺼", output: {action: EMERGENCY_STOP, target: all}}
    - {id: em_13, tone: 평서, text: "비상이야", output: {action: EMERGENCY_STOP, target: all}}
    - {id: em_14, tone: 명령, text: "비상 정지", output: {action: EMERGENCY_STOP, target: all}}
    - {id: em_15, tone: 평서, text: "긴급 상황이야", output: {action: EMERGENCY_STOP, target: all}}
    - {id: em_16, tone: 명령, text: "스탑", output: {action: EMERGENCY_STOP, target: all}}
    - {id: em_17, tone: 명령, text: "중지 중지", output: {action: EMERGENCY_STOP, target: all}}
    - {id: em_18, tone: 요청, text: "다 멈춰 주세요", output: {action: EMERGENCY_STOP, target: all}}
    - {id: em_19, tone: 요청, text: "당장 멈춰 주세요", output: {action: EMERGENCY_STOP, target: all}}
    - {id: em_20, tone: 요청, text: "빨리 정지해 주세요", output: {action: EMERGENCY_STOP, target: all}}
    - {id: em_21, tone: 평서, text: "큰일 났어 다 꺼", output: {action: EMERGENCY_STOP, target: all}}
